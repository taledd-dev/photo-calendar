    .print-sheet.pad { padding: 7mm 7mm 6mm; }

      .print-sheet { width: 281mm !important; height: 193mm !important; max-width: none !important; aspect-ratio: auto !important; border: none !important; box-shadow: none !important; margin: 0 !important; }

</style>

<body>
<div id="root"></div>
<script>
const { useState, useEffect, useCallback, useRef, useMemo } = React;
const e = React.createElement;

// The Photoplan logo mark (viewfinder + mountain + sun). The brown-on-light
// version suits the site's cream background; the favicon/app icon variants are
// linked from the <head>.
const LOGO_SRC = 'assets/photoplan-mark.svg';
const IG_HANDLE = 'llandscapist'; // the owner's Instagram (home page + printed grid pages)
// Longest edge of the print-size photo copy (<base>-print): 3200px is ~290 dpi
// across an A4-landscape sheet, enough for a photo-book / print-shop calendar.
const PRINT_MAX_EDGE = 3200;

// Whether editing controls are shown (the owner, with the password) or the page
// is view-only (family). Editable, KitField and LocationPhoto read it through
// this context, so call sites don't need to know.
const EditCtx = React.createContext(true);
// App's site-styled confirm dialog, for components outside App (LocationPhoto's
// ×): askConfirm({ title, label, confirm, danger }) → Promise<boolean>.
const ConfirmCtx = React.createContext(null);
// Per-photo focus point: the part of a photo to keep when a slot crops it, as
// [fx, fy] fractions of the image (unset = centre), stored in
// data[0].photoFocus keyed by the photo's storage base. The context carries
// { map, set(base, fx, fy) } — `set` is null for visitors. focusStyle() turns
// a point into the object-position for an object-fit: cover image.
const FocusCtx = React.createContext({ map: {}, set: null });
function focusStyle(map, base) {
  const f = map && map[base];
  return f ? { objectPosition: (f[0] * 100).toFixed(1) + '% ' + (f[1] * 100).toFixed(1) + '%' } : {};
}

// ─── Storage ────────────────────────────────────────────────────────────────
// The single "switch" for where saved data lives. Calendar text (locations,
// events, edits) is kept in the browser's local storage. PHOTOS now live in the
// cloud (Cloudflare R2), reached through the storage Worker below, so they are
// shared across devices and visible to anyone viewing the calendar.
const STORAGE_VERSION = 1;

// The web address of your storage Worker — the safe gatekeeper in front of R2.
// Photos are read from / written to `${PHOTO_STORAGE_BASE}/photo/<name>`.
const PHOTO_STORAGE_BASE = 'https://photo-calendar-storage.taledd95.workers.dev';

const Storage = {
  loadData() {
    try {
      const raw = localStorage.getItem('calendar:data');
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.version !== STORAGE_VERSION) return null;
      return parsed.data;
    } catch (_) { return null; }
  },
  saveData(data) {
    try { localStorage.setItem('calendar:data', JSON.stringify({ version: STORAGE_VERSION, data })); } catch (_) {}
  },
  clearData() {
    try { localStorage.removeItem('calendar:data'); } catch (_) {}
  },
  // ── Photos: stored in R2 via the Worker. Anyone can view; uploading or ──────
  // removing requires the upload password (kept only in the owner's browser).
  photoUrl(id, bust) {
    return PHOTO_STORAGE_BASE + '/photo/' + encodeURIComponent(id) + (bust ? ('?t=' + bust) : '');
  },
  // (The password itself is asked for by the app's own dialog — see
  // ensureUnlocked in App — never by a browser prompt.)
  clearUploadKey() {
    try { localStorage.removeItem('calendar:uploadKey'); } catch (_) {}
  },
  async saveImage(id, file, key) {
    try {
      const res = await fetch(this.photoUrl(id), {
        method: 'PUT',
        headers: { 'x-upload-key': key, 'Content-Type': file.type || 'application/octet-stream' },
        body: file,
      });
      if (res.status === 401) { this.clearUploadKey(); alert('That upload password was not accepted — please try again.'); return false; }
      if (!res.ok) { alert('Upload failed (' + res.status + '). Please try again.'); return false; }
      return true;
    } catch (_) { alert('Could not reach photo storage. Check your connection and try again.'); return false; }
  },
  async removeImage(id, key) {
    try {
      const res = await fetch(this.photoUrl(id), { method: 'DELETE', headers: { 'x-upload-key': key } });
      if (res.status === 401) { this.clearUploadKey(); alert('That upload password was not accepted — please try again.'); return false; }
      return res.ok;
    } catch (_) { alert('Could not reach photo storage to remove the photo.'); return false; }
  },
  // Read the stored upload password WITHOUT prompting (used to tell whether
  // this browser is the owner's, so viewers never get asked for a password).
  peekUploadKey() {
    try { return localStorage.getItem('calendar:uploadKey'); } catch (_) { return null; }
  },
  setUploadKey(k) {
    try { if (k) localStorage.setItem('calendar:uploadKey', k); } catch (_) {}
  },
  // Photo metadata (currently the "year taken" for each location) is shared via a
  // tiny JSON file in R2, so everyone viewing the calendar sees the same info —
  // captions are otherwise built automatically from the location name and month.
  async loadMeta() {
    try {
      const res = await fetch(this.photoUrl('photo-meta.json', Date.now()), { cache: 'no-store' });
      if (!res.ok) return null;
      return await res.json();
    } catch (_) { return null; }
  },
  async saveMeta(meta, key) {
    try {
      const res = await fetch(this.photoUrl('photo-meta.json'), {
        method: 'PUT',
        headers: { 'x-upload-key': key, 'Content-Type': 'application/json' },
        body: JSON.stringify(meta),
      });
      if (res.status === 401) { this.clearUploadKey(); alert('That upload password was not accepted — please try again.'); return false; }
      return res.ok;
    } catch (_) { return false; }
  },
  // The whole calendar dataset (locations, events, edits, coordinates, ticks) is
  // shared via calendar-data.json in R2 — everyone reads it, only the owner (with
  // the upload password) writes it. Local storage stays a fast, offline cache.
  //
  // Resolves to one of:
  //   { status:'ok', data, savedAt }  a readable copy exists (savedAt = its stamp)
  //   { status:'empty' }              nothing saved yet — the first save creates it
  //   { status:'error' }              unreachable, or unreadable. Never treated as
  //                                   empty: a save on top would destroy real data.
  workerV2: false, // set once a response shows the Worker enforces x-if-saved-at
  async loadCloudData() {
    try {
      const res = await fetch(this.photoUrl('calendar-data.json', Date.now()), { cache: 'no-store' });
      if (res.status === 404) return { status: 'empty' };
      if (!res.ok) return { status: 'error' };
      this.workerV2 = res.headers.get('x-photoplan-worker') === '2';
      const parsed = await res.json();
      if (!parsed || parsed.version !== STORAGE_VERSION || !Array.isArray(parsed.data)) return { status: 'error' };
      return { status: 'ok', data: parsed.data, savedAt: typeof parsed.savedAt === 'number' ? parsed.savedAt : null };
    } catch (_) { return { status: 'error' }; }
  },
  // Write the shared calendar — but only if the cloud copy still carries the
  // stamp this device last saw (`expectSavedAt`; null = "there should be none
  // yet"). That is what stops two devices overwriting each other unseen. The
  // check runs here before the PUT, and again inside the Worker (409) once the
  // v2 Worker is deployed. Resolves to { ok:true, savedAt } or
  // { ok:false, reason, cloud? } with reason 'conflict' (the newer cloud copy is
  // returned as `cloud` for adoption; null if it has vanished), 'unauthorized',
  // 'network' or 'error'.
  async saveCloudData(data, key, expectSavedAt) {
    const cur = await this.loadCloudData();
    if (cur.status === 'error') return { ok: false, reason: 'network' };
    if (cur.status === 'ok' && cur.savedAt !== expectSavedAt) return { ok: false, reason: 'conflict', cloud: cur };
    if (cur.status === 'empty' && expectSavedAt != null) return { ok: false, reason: 'conflict', cloud: null };
    const savedAt = Date.now();
    try {
      const headers = { 'x-upload-key': key, 'Content-Type': 'application/json' };
      if (this.workerV2) headers['x-if-saved-at'] = expectSavedAt == null ? 'none' : String(expectSavedAt);
      const res = await fetch(this.photoUrl('calendar-data.json'), {
        method: 'PUT',
        headers,
        body: JSON.stringify({ version: STORAGE_VERSION, savedAt, data }),
      });
      if (res.status === 401) { this.clearUploadKey(); return { ok: false, reason: 'unauthorized' }; }
      if (res.status === 409) { const again = await this.loadCloudData(); return { ok: false, reason: 'conflict', cloud: again.status === 'ok' ? again : null }; }
      if (!res.ok) return { ok: false, reason: 'error' };
      return { ok: true, savedAt };
    } catch (_) { return { ok: false, reason: 'network' }; }
  },
  // Save an uploaded photo as three sizes: a small thumbnail (<base>-thumb) for
  // the location cards, a hero (<base>, 1600px) for the slideshows, and a
  // print-size copy (<base>-print, PRINT_MAX_EDGE) for the printable calendar.
  // Web pages never load the print copy. Photos uploaded before the print size
  // existed have no -print copy; the print page flags those for re-upload.
  async savePhotoVariants(base, file, key) {
    let hero, thumb, print;
    try {
      hero = await resizeImage(file, 1600, 0.85);
      thumb = await resizeImage(file, 500, 0.8);
      print = await resizeImage(file, PRINT_MAX_EDGE, 0.9);
    } catch (_) { alert('Could not process that image — please try a different photo.'); return false; }
    const okHero = await this.saveImage(base, hero || file, key);
    if (!okHero) return false;
    const okThumb = await this.saveImage(base + '-thumb', thumb || hero || file, key);
    if (!okThumb) return false;
    const okPrint = await this.saveImage(base + '-print', print || hero || file, key);
    if (!okPrint) alert('The photo was saved, but its print-size copy did not upload — please drop the photo on again.');
    return okPrint;
  },
  async removePhotoVariants(base, key) {
    const ok = await this.removeImage(base, key);
    await this.removeImage(base + '-thumb', key);
    await this.removeImage(base + '-print', key);
    return ok;
  },
  // Copy a stored photo to a new name (photos are keyed by month, so moving a
  // location between months means re-homing its image). Returns false if there
  // was nothing to copy.
  async copyImage(fromId, toId, key) {
    try {
      // the password header lets the private print-size copies be read too
      const res = await fetch(this.photoUrl(fromId, Date.now()), { cache: 'no-store', headers: { 'x-upload-key': key } });
      if (!res.ok) return false;
      const blob = await res.blob();
      return await this.saveImage(toId, blob, key);
    } catch (_) { return false; }
  },
  // Move every size of a location's photo to a new base name. The originals are
  // only deleted once at least one copy has landed safely. (An older photo may
  // have no -print copy; that copy simply fails and is skipped.)
  async movePhotoVariants(fromBase, toBase, key) {
    const okHero = await this.copyImage(fromBase, toBase, key);
    const okThumb = await this.copyImage(fromBase + '-thumb', toBase + '-thumb', key);
    const okPrint = await this.copyImage(fromBase + '-print', toBase + '-print', key);
    if (okHero || okThumb) {
      await this.removeImage(fromBase, key);
      await this.removeImage(fromBase + '-thumb', key);
      if (okPrint) await this.removeImage(fromBase + '-print', key);
    }
    return okHero || okThumb;
  },
  // Every stored photo key (under photos/) in one request, from the Worker's
  // GET /list — replaces probing each thumbnail. Resolves to a Set of keys, or
  // null when the Worker predates /list (callers then fall back to probing).
  async loadPhotoIndex() {
    try {
      const res = await fetch(PHOTO_STORAGE_BASE + '/list?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return null;
      const parsed = await res.json();
      return Array.isArray(parsed.keys) ? new Set(parsed.keys) : null;
    } catch (_) { return null; }
  },
  // The Worker's automatic backups of calendar-data.json (v2), newest first,
  // as { key, uploaded, size }. null when the Worker predates them or can't
  // be reached.
  async loadBackups() {
    try {
      const res = await fetch(PHOTO_STORAGE_BASE + '/backups?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return null;
      const parsed = await res.json();
      return Array.isArray(parsed.backups) ? parsed.backups : null;
    } catch (_) { return null; }
  },
  // One backup as the { version, savedAt, data } it was written as, or null.
  async loadBackup(key) {
    try {
      const res = await fetch(this.photoUrl(key, Date.now()), { cache: 'no-store' });
      if (!res.ok) return null;
      const parsed = await res.json();
      if (!parsed || parsed.version !== STORAGE_VERSION || !Array.isArray(parsed.data)) return null;
      return parsed;
    } catch (_) { return null; }
  },
};

// ─── Helpers ────────────────────────────────────────────────────────────────
// A per-device marker that the last visit ended with changes not yet confirmed
// in the cloud (see the cloud-sync notes in App). Read on the next visit.
function readUnsavedFlag() { try { return localStorage.getItem('calendar:dirty') === '1'; } catch (_) { return false; } }
function writeUnsavedFlag(on) { try { if (on) localStorage.setItem('calendar:dirty', '1'); else localStorage.removeItem('calendar:dirty'); } catch (_) {} }

// Keyboard activation for non-<button> elements that act as buttons (they carry
// role="button" + tabIndex): Enter or Space fires the same handler as a click.
function keyActivate(handler) {
  return (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); handler(ev); } };
}

// A location's coordinates as [lat, lng] — its own if set, else the built-in
// table's, else null — plus deep links into the two phone map apps.
function coordsOf(loc) {
  const fb = LOCATION_COORDS[loc.id] || [];
  const la = typeof loc.lat === 'number' ? loc.lat : fb[0];
  const lo = typeof loc.lng === 'number' ? loc.lng : fb[1];
  return (typeof la === 'number' && typeof lo === 'number') ? [la, lo] : null;
}

// ─── Astronomy ───────────────────────────────────────────────────────────────
// Everything the calendar needs for any year, computed rather than typed in:
// moon phases (Meeus, Astronomical Algorithms ch. 49 — good to a few minutes),
// equinoxes/solstices (iterating the Sun's apparent longitude to the cardinal
// points — good to ~15 min), UK clock changes, and sunrise/sunset/golden-hour
// times at any coordinates (the NOAA solar-calculator method). Calendar dates
// are taken in UK civil time (GMT/BST): this is a UK calendar. Checked against
// the 2026 almanac and the hand-seeded 2027/28 years (scratch test, Nov 2026).
const RAD = Math.PI / 180;

function norm360(x) { return ((x % 360) + 360) % 360; }

// 01:00 UTC on the last Sunday of October.
function lastSunday(year, monthIdx) { const d = new Date(Date.UTC(year, monthIdx + 1, 0)); return d.getUTCDate() - d.getUTCDay(); }

  const y = date.getUTCFullYear();
  const start = Date.UTC(y, 2, lastSunday(y, 2), 1), end = Date.UTC(y, 9, lastSunday(y, 9), 1);
  const t = date.getTime();
  return (t >= start && t < end) ? 1 : 0;
}
// A UTC instant as UK-local calendar parts { y, m (0-11), d, hh, mm }.
function ukParts(date) {
  const t = new Date(date.getTime() + ukOffsetHours(date) * 3600000);
  return { y: t.getUTCFullYear(), m: t.getUTCMonth(), d: t.getUTCDate(), hh: t.getUTCHours(), mm: t.getUTCMinutes() };
}

// The Sun for a Julian day: apparent longitude (deg), declination (deg) and
// the equation of time (minutes). Low-precision series, about ±0.01°.
function sunPosition(jd) {
  const T = (jd - J2000) / 36525;
  const L0 = norm360(280.46646 + T * (36000.76983 + 0.0003032 * T));
  const M = norm360(357.52911 + T * (35999.05029 - 0.0001537 * T));
  const ecc = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
  const Mr = M * RAD;
  const C = Math.sin(Mr) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * Mr) * (0.019993 - 0.000101 * T) + Math.sin(3 * Mr) * 0.000289;
  const omega = 125.04 - 1934.136 * T;
  const lambda = L0 + C - 0.00569 - 0.00478 * Math.sin(omega * RAD);
  const eps0 = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
  const eps = eps0 + 0.00256 * Math.cos(omega * RAD);
  const decl = Math.asin(Math.sin(eps * RAD) * Math.sin(lambda * RAD)) / RAD;
  const y = Math.tan(eps * RAD / 2) ** 2;
  const L0r = L0 * RAD;
  const eot = 4 * (y * Math.sin(2 * L0r) - 2 * ecc * Math.sin(Mr) + 4 * ecc * y * Math.sin(Mr) * Math.cos(2 * L0r) - 0.5 * y * y * Math.sin(4 * L0r) - 1.25 * ecc * ecc * Math.sin(2 * Mr)) / RAD;
  return { lambda: norm360(lambda), decl, eot };
}

// Minutes past 0h UTC when the Sun's centre crosses a zenith angle on the
// given UTC date (90.833° = rise/set, 84° = the 6°-up golden-hour edge, 96° =
// civil dawn/dusk), or null when it never does (midnight sun / polar night).
// `dir` is -1 for the morning crossing, +1 for the evening one.
function sunCrossing(dateUTC, lat, lng, zenith, dir) {
  const jd0 = Math.floor(jdFromDate(dateUTC) + 0.5) - 0.5; // 0h UT that day
  let t = 720 - 4 * lng; // first guess: local solar noon
  for (let i = 0; i < 3; i++) {

    const cosH = Math.cos(zenith * RAD) / (Math.cos(lat * RAD) * Math.cos(s.decl * RAD)) - Math.tan(lat * RAD) * Math.tan(s.decl * RAD);
    if (cosH > 1 || cosH < -1) return null;
    const H = Math.acos(cosH) / RAD;
    t = 720 - 4 * (lng - dir * H) - s.eot;

function sunTimes(dateUTC, lat, lng) {

    goldenEnd: sunCrossing(dateUTC, lat, lng, 84, -1), goldenStart: sunCrossing(dateUTC, lat, lng, 84, 1),

// The calendar's home reference for sunrise/sunset: Hindhead, Surrey.
const HOME_REF = { name: 'Hindhead', coords: [51.1140, -0.7290] };
// The light at a place on a date: times in UK civil time for UK coordinates
// and in UTC elsewhere (there's no time-zone table for far-flung spots), plus
// the day length in hours. `polar` names the case when the Sun never rises
// ('polar night') or never sets ('midnight sun'); otherwise null.
function lightAt(lat, lng, year, monthIdx, day) {
  const date = new Date(Date.UTC(year, monthIdx, day, 12));
  const uk = coordsInUK(lat, lng);
  const off = uk ? ukOffsetHours(date) : 0;
  const s = sunTimes(date, lat, lng);
  const f = (m) => fmtMinutes(m, off);

  let polar = null;
  if (s.rise == null) { const noonAlt = 90 - Math.abs(lat - sunPosition(jdFromDate(date)).decl); polar = noonAlt > 0 ? 'midnight sun' : 'polar night'; }

// ── Moon phases (Meeus ch. 49). k integer = new moon, k + 0.5 = full moon,

  const F = (160.7108 + 390.67050284 * k - 0.0016118 * T2 - 0.00000227 * T3 + 0.000000011 * T4) * RAD;

    - 0.00111 * s(Mp - 2 * F) - 0.00057 * s(Mp + 2 * F) + 0.00056 * E * s(2 * Mp + M) - 0.00042 * s(3 * Mp)
    + 0.00042 * E * s(M + 2 * F) + 0.00038 * E * s(M - 2 * F) - 0.00024 * E * s(2 * Mp - M) - 0.00017 * s(Om)
    - 0.00007 * s(Mp + 2 * M) + 0.00004 * s(2 * Mp - 2 * F) + 0.00004 * s(3 * M) + 0.00003 * s(Mp + M - 2 * F)
    + 0.00003 * s(2 * Mp + 2 * F) - 0.00003 * s(Mp + M + 2 * F) + 0.00003 * s(Mp - M + 2 * F) - 0.00002 * s(Mp - M - 2 * F)
    - 0.00002 * s(3 * Mp + M) + 0.00002 * s(4 * Mp);

function moonPhasesInYear(year) {

  for (let k = k0; k < k0 + 16; k++) {

  const [fc, setFc] = useState({ status: 'idle' });
  const [kp, setKp] = useState(null);
  const cacheRef = useRef({});
  const coordKey = sel ? sel.coords.join(',') : '';

  // Forecast for the chosen spot — Met Office model first for UK coordinates,
  // then Open-Meteo's best match; cached for the session.
  useEffect(() => {
    if (!sel) return;
    if (cacheRef.current[coordKey]) { setFc({ status: 'ok', data: cacheRef.current[coordKey] }); return; }
    const ctrl = new AbortController(); let cancelled = false;
    setFc({ status: 'loading' });
    (async () => {
      const [lat, lng] = sel.coords;
      const base = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lng
        + '&hourly=temperature_2m,precipitation_probability,weather_code,cloud_cover,cloud_cover_low,visibility,wind_speed_10m,wind_gusts_10m'
        + '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max'
        + '&wind_speed_unit=mph&timezone=auto&forecast_days=7';
      const tries = coordsInUK(lat, lng) ? [base + '&models=ukmo_seamless', base] : [base];
      for (const url of tries) {
        try {
          const res = await fetch(url, { signal: ctrl.signal });
          if (!res.ok) continue;
          const json = await res.json();
          if (!json || !json.daily || !json.hourly || !json.daily.time) continue;
          json._model = url.indexOf('ukmo') !== -1 ? 'Met Office (UKMO) model' : 'best-match model';
          if (cancelled) return;
          cacheRef.current[coordKey] = json; setFc({ status: 'ok', data: json }); return;
        } catch (_) { if (cancelled) return; }

  // Live planetary K index (NOAA SWPC) for the aurora line; quietly absent if it fails.

    const nearest = (iso) => { if (!iso) return null; const h = parseInt(iso.slice(11, 13), 10) + (parseInt(iso.slice(14, 16), 10) >= 30 ? 1 : 0); const k = keyAt(iso.slice(0, 10), h); return idx[k] != null ? idx[k] : null; };
    const pick = (arr, i) => (arr && i != null && arr[i] != null) ? arr[i] : null;

      const riseI = nearest(D.sunrise[di]), setI = nearest(D.sunset[di]);

        sunrise: (D.sunrise[di] || '').slice(11, 16), sunset: (D.sunset[di] || '').slice(11, 16),

    });

  const kpWord = (v) => v >= 7 ? 'storm — aurora possible across the UK' : v >= 5 ? 'storm — aurora possible in Scotland & the north' : v >= 4 ? 'active — watch the north' : v >= 3 ? 'unsettled' : 'quiet';

  const links = sel ? (() => {

  return e('div', null,
    // Header
    e('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:24, flexWrap:'wrap' } },
      e('div', null,
        e('div', { onClick:onBack, onKeyDown:keyActivate(onBack), role:'button', tabIndex:0, title:'Back to the home page', style:{ display:'inline-flex', alignItems:'center', gap:9, cursor:'pointer' } },
          e('img', { src:LOGO_SRC, alt:'', style:{ height:24, width:'auto', display:'block' } }),
          e('div', { style:{ fontFamily:"'Figtree',system-ui,sans-serif", fontWeight:700, fontSize:12.5, letterSpacing:'0.24em', textTransform:'uppercase', color:'#201e1d' } }, 'Photoplan')),
        e('h1', { style:{ margin:'6px 0 0', fontFamily:"'Zilla Slab',serif", fontWeight:700, fontSize:isMobile?'clamp(32px,10vw,40px)':'clamp(40px,6vw,58px)', lineHeight:'0.95', color:'#2A251E', letterSpacing:'-0.01em' } }, 'Weather'),
        e('div', { style:{ marginTop:8, fontSize:isMobile?15:16, color:'#6E6450', maxWidth:'46ch', lineHeight:1.5 } }, 'What the sky is doing at each spot, read the way a photographer needs it: cloud at dawn and dusk, the night, the moon — and what each kind of shoot wants.')
      ),
      e('div', { style:{ display:'flex', flexDirection:'column', alignItems:isMobile?'flex-start':'flex-end', gap:14, ...(isMobile?{width:'100%'}:{}) } }, navControl)
    ),
    e('div', { style:{ height:1, background:'#D2C7AC', margin:isMobile?'16px 0 18px':'22px 0 24px' } }),

    // Location picker + outlook
    places.length === 0
      ? e('div', { style:{ ...card, padding:18, fontSize:14, color:'#6E6450' } }, 'Add map coordinates to a location to see its forecast here.')
      : e('div', null,
          // Default spot (owner sets it; it's what the page opens on) — or view any other.
          (() => {
            const selStyle = { height:38, padding:'0 12px', background:'#FFFDF5', border:'1px solid #B3A988', color:'#2A251E', fontFamily:mono, fontSize:12, letterSpacing:'.04em', cursor:'pointer', borderRadius:0, maxWidth:'100%' };
            const groups = (placeholder) => [
              placeholder ? e('option', { key:'_', value:'' }, placeholder) : null,
              ...data.map((m, i) => { const ps = places.filter(p => p.i === i); return ps.length ? e('optgroup', { key:m.key, label:m.name }, ps.map(p => e('option', { key:p.loc.id, value:p.loc.id }, p.loc.name))) : null; })
            ];

              label('Default'),
              onSetDefault
                ? e('select', { value: savedDefault || '', onChange:(ev)=>{ const id = ev.target.value || null; onSetDefault(id); if (id) setSelId(id); }, 'aria-label':'Default location for the Weather page', title:'The location this page opens on', style:{ ...selStyle, borderColor: savedDefault ? '#54632F' : '#B3A988' } },
                    groups('Not set — first spot of the current month'))
                : e('span', { style:{ fontFamily:mono, fontSize:12, color:'#2A251E', letterSpacing:'.04em' } }, defPlace ? defPlace.loc.name : 'the current month’s first spot'),
              e('span', { style:{ fontFamily:mono, fontSize:10.5, letterSpacing:'.14em', textTransform:'uppercase', color:'#B7AD90' } }, 'or'),
              label('View'),
              e('select', { value: sel ? sel.loc.id : '', onChange:(ev)=>setSelId(ev.target.value), 'aria-label':'Location for the forecast', style:selStyle }, groups(null)),

            );

            e('div', null,

              e('div', { style:{ fontSize:13.5, color:'#6E6450', marginTop:2 } }, (sel.loc.where || '') + ' · ' + sel.coords[0].toFixed(3) + ', ' + sel.coords[1].toFixed(3))),
            e('div', { style:{ fontFamily:mono, fontSize:10.5, color:'#A89A7C', letterSpacing:'.06em' } },
              fc.status === 'ok' ? 'Seven days · ' + fc.data._model + ' · local time ' + (fc.data.timezone_abbreviation || '') : fc.status === 'loading' ? 'Fetching the forecast…' : fc.status === 'error' ? 'The forecast service could not be reached' : '')

            kp && e('span', { style:{ fontFamily:mono, fontSize:11, letterSpacing:'.04em', color: kpTone(kp.value) } }, '✦ Aurora now: Kp ' + kp.value.toFixed(1) + ' — ' + kpWord(kp.value) + ' (NOAA ' + kp.time.slice(11) + ' UTC)'),
            ...links
          ),
          // Days
          e('div', { style:{ marginTop:16, display:'flex', flexDirection:'column', gap:8 } },
            fc.status === 'loading' && e('div', { style:{ ...card, padding:16, fontFamily:mono, fontSize:11, color:'#8A7D63', letterSpacing:'.04em' } }, 'Loading…'),
            fc.status === 'error' && e('div', { style:{ ...card, padding:16, fontSize:14, color:'#6E6450', lineHeight:1.5 } }, 'No live forecast right now — the links above open the same spot on the forecast sites.'),
            days.map(dayRow)
          ),
          fc.status === 'ok' && e('div', { style:{ marginTop:10, fontFamily:mono, fontSize:10.5, color:'#A89A7C', letterSpacing:'.03em', lineHeight:1.6 } }, 'Cloud figures are total cover at the hour nearest sunrise, sunset and 01:00. Treat days four to seven as a trend, not a plan. Data: Open-Meteo.com (CC BY 4.0).')
        ),

    // Guide
    e('div', { style:{ display:'flex', alignItems:'center', gap:14, marginTop:44 } },
      e('span', { style:{ fontFamily:mono, fontSize:11, letterSpacing:'.2em', textTransform:'uppercase', color:'#8A7D63', whiteSpace:'nowrap' } }, 'Conditions & settings'),
      e('span', { style:{ flex:1, height:1, background:'#D2C7AC' } }),
      e('span', { style:{ fontFamily:mono, fontSize:11, letterSpacing:'.06em', color:'#A89A7C', whiteSpace:'nowrap' } }, WEATHER_GUIDE.length + ' kinds of shoot')
    ),
    e('div', { style:{ marginTop:16, display:'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(2, minmax(0, 1fr))', gap:12 } },
      WEATHER_GUIDE.map(g => e('div', { key:g.title, style:{ ...card, padding: isMobile ? '14px 14px 15px' : '16px 18px 17px' } },
        e('div', { style:{ display:'flex', alignItems:'baseline', gap:9 } },
          e('span', { style:{ fontFamily:mono, color:'#9E4B26', fontSize:13 } }, g.glyph),
          e('div', { style:{ fontFamily:"'Zilla Slab',serif", fontWeight:700, fontSize:17, color:'#2A251E' } }, g.title)),
        [['Conditions', g.conditions], ['Settings', g.settings], ['Tips', g.tips]].map(([k, v]) =>
          e('div', { key:k, style:{ marginTop:10 } }, label(k), e('div', { style:{ fontSize:14, color:'#3B3528', lineHeight:1.5, marginTop:3 } }, v)))
      ))
    )
  );
}

function MapView({ places, onOpenMonth, onToggleVisited, onBack, introText, onEditIntro, editMode, editControl }) {
  const VW = 1000, VH = 640, VMIN = 1, VMAX = 20, PAPER = '#FCFAF1';
  const isMobile = useIsMobile();
  const [hoveredId, setHoveredId] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [region, setRegion] = useState('All');
  const [month, setMonth] = useState(null);
  const [status, setStatus] = useState('All');
  const [zoomK, setZoomK] = useState(1);
  const [pan, setPan] = useState({ x: 0, y: 0 });
  const [dragging, setDragging] = useState(false);
  const [phase, setPhase] = useState('loading');
  const [featVer, setFeatVer] = useState(0);
  const featuresRef = useRef(null);
  const ptrsRef = useRef({});                    // active pointers (touch/mouse) by id, in SVG coords
  const gestureRef = useRef(null);               // current gesture: pan or pinch, with its start state
  const viewRef = useRef({ k: 1, x: 0, y: 0 });  // live view, mirrors zoomK/pan for gesture maths

  // Lazy-load d3 + topojson + the country outlines the first time the map opens.
  useEffect(() => {

        if (!window.d3 || !window.d3.geoMercator) await ensureScript('https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js');
        if (!window.topojson) await ensureScript('https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js');
        if (cancelled) return;
        if (!window.d3 || !window.d3.geoMercator) { setPhase('error'); return; }
        setPhase('ready');
        const topo = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then(r => r.json());
        if (cancelled || !window.topojson) return;

    })();
    return () => { cancelled = true; };
  }, []);

  const colorFor = (r) => r === 'UK' ? '#54632F' : '#9E4B26';

  // Project points + country paths. Recompute when the location set changes (so a
  // newly added/moved pin reframes the map) or when the countries finish loading.
  const sig = places.map(p => p.id + ',' + p.lat + ',' + p.lng).join(';');
  const map = useMemo(() => {
    const d3 = window.d3;
    if (!d3 || !d3.geoMercator) return null;
    const W = VW, H = VH, m = 44;
    const pts = places.filter(p => p.lat != null).map(p => [p.lng, p.lat]);
    if (!pts.length) return null;
    const proj = d3.geoMercator();
    proj.fitExtent([[m, m], [W - m, H - m]], { type: 'MultiPoint', coordinates: pts });
    const path = d3.geoPath(proj);
    let countries = [];
    if (featuresRef.current) countries = featuresRef.current.map((f, i) => ({ id: 'c' + i, d: path(f) })).filter(c => c.d);
    const graticule = path(d3.geoGraticule().step([10, 10])()) || '';
    const geo = {};
    places.forEach(l => { const xy = proj([l.lng, l.lat]); geo[l.id] = xy ? { x: +xy[0].toFixed(1), y: +xy[1].toFixed(1) } : null; });
    return { W, H, countries, graticule, geo };
  }, [sig, featVer, phase]);

  const clampPan = (tx, ty, k) => { const minX = -VW * (k - 1), minY = -VH * (k - 1); return [Math.min(0, Math.max(minX, tx)), Math.min(0, Math.max(minY, ty))]; };
  const clampZoom = (k) => Math.max(VMIN, Math.min(VMAX, k));

  };

    const v = viewRef.current;
    kNew = clampZoom(kNew);
    applyView(kNew, fx - (kNew / v.k) * (fx - v.x), fy - (kNew / v.k) * (fy - v.y));
  };

  const ptMid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

    const v = viewRef.current;

      e('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 7 } }, e('svg', { width: 14, height: 14, viewBox: '0 0 14 14' }, e('circle', { cx: 7, cy: 7, r: 4.4, fill: '#FCFAF1', stroke: '#54632F', strokeWidth: 2 })), ' To visit'),
      e('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 7 } }, e('svg', { width: 16, height: 14, viewBox: '0 0 16 14' }, e('circle', { cx: 8, cy: 7, r: 6.2, fill: 'none', stroke: '#54632F', strokeWidth: 1.3 }), e('circle', { cx: 8, cy: 7, r: 4, fill: '#54632F' })), ' Shot in 2+ months')
    )
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const isMobile = useIsMobile();
  const [data, setData] = useState(() => migrateYearEvents(Storage.loadData() || makeData()));

  // stays local to the device rather than in the shared data.
  const [viewYear, setViewYear] = useState(() => {
    try { const y = parseInt(localStorage.getItem('calendar:year'), 10); if (YEARS.indexOf(y) !== -1) return y; } catch (_) {}

  const [galleryView, setGalleryView] = useState(false);

  useEffect(() => { try { localStorage.setItem('calendar:lbBare', lbBare ? '1' : '0'); } catch (_) {} }, [lbBare]);

  const [geocoding, setGeocoding] = useState(null);   // { done, total } while areas are being looked up

  const [tplEditing, setTplEditing] = useState(false); // the usual-packing-list textarea on the Trips page

  const [monthIdx, setMonthIdx] = useState(0);

  const [draggingLoc, setDraggingLoc] = useState(null);

  const [imgEpoch, setImgEpoch] = useState(0); // bumped after an upload so tiles + slideshows refresh
  // Which photos exist, as a Set of R2 keys from the Worker's /list — one
  // request instead of probing every thumbnail. undefined = not loaded yet;

  useEffect(() => { refreshPhotoIndex(); }, []);

  // Editing controls shown (owner) or view-only (family). Starts on for a
  // device that already holds the password; "Unlock editing" turns it on.
  const [editMode, setEditMode] = useState(() => !!Storage.peekUploadKey());

  // (controls hidden, or re-locked by a 401), and its button only shows in edit mode.
  useEffect(() => { if (!editMode) setPrintView(false); }, [editMode]);

  // ── In-app prompt dialog ───────────────────────────────────────────────────
  // Replaces the browser's prompt() for the edit password and short names, in
  // the site's own style. askText(opts) resolves to the entered string, or null
  // on Cancel/Escape/backdrop. kind:'password' masks the input with a reveal
  // (eye) toggle. Only one dialog at a time — a new ask supersedes an open one.
  const [dialog, setDialog] = useState(null);
  const dialogResolve = useRef(null);
  const askText = (opts) => new Promise(resolve => {
    if (dialogResolve.current) dialogResolve.current(null);

    setDialog({ value: opts.initial || '', reveal: false, ...opts });
  });
  const closeDialog = (result) => {
    const r = dialogResolve.current; dialogResolve.current = null;
    setDialog(null);
    if (r) r(result);
  };
  // The same dialog as a yes/no question (no input): resolves true on the
  // confirm button, false on Cancel/Escape/backdrop. `danger` colours the
  // button for irreversible actions.
  const askConfirm = (opts) => askText({ kind:'confirm', ...opts }).then(r => r !== null);
  // A quiet confirmation at the foot of the page ("From the photo: the year
  // '24 filled in."), gone after a few seconds.
  const [notice, setNotice] = useState(null);
  const noticeTimer = useRef(null);
  const showNotice = (text) => {
    clearTimeout(noticeTimer.current);
    setNotice(text);
    noticeTimer.current = setTimeout(() => setNotice(null), 5000);
  };
  const uidRef = useRef(100);
  const unlockedRef = useRef(false);   // true once the edit password has been entered on this device

  // Save the calendar (locations, events, edits, ordering, ticked-off spots)
  // every time anything changes, so it survives a page reload.
  useEffect(() => { Storage.saveData(data); }, [data]);

  // ── Cloud sync ─────────────────────────────────────────────────────────────
  // The cloud copy (calendar-data.json) is the source of truth; local storage is
  // a cache that shows instantly and is then replaced. Safety rules:
  //  • Editing stays paused (ensureUnlocked refuses) until a cloud load has
  //    settled as 'ok' or 'empty' — never after an 'error', which would risk
  //    pushing a stale cache over the real data.
  //  • This device remembers the `savedAt` stamp of the copy it is in step with
  //    (cloudStamp). Every save first checks the cloud still carries that stamp;
  //    if another device saved in between, the newer copy is loaded instead and
  //    the local change is reported as lost — never silently overwritten.
  //  • The copy is re-fetched whenever the tab regains focus, comes back online,
  //    and every few minutes, so devices rarely diverge in the first place.
  //  • A save that fails for network reasons is retried, shown in a banner,
  //    warned about on tab close, and remembered across reloads (the next load
  //    asks whether to keep or discard the unsaved changes).
  const [cloudReady, setCloudReady] = useState(false);       // load settled (ok/empty) → edits allowed
  const [cloudStatus, setCloudStatus] = useState('loading'); // 'loading' | 'ok' | 'offline' | 'unsaved'
  const [dirty, setDirty] = useState(false);                 // local changes not yet confirmed in the cloud
  const [retryNonce, setRetryNonce] = useState(0);           // bumps to re-arm the save retry timer
  const cloudReadyRef = useRef(false);
  const cloudStamp = useRef(null);      // savedAt of the cloud copy this device is in step with
  const syncedRef = useRef(null);       // the data object known to match the cloud (never re-saved)
  const dataRef = useRef(data);
  const dirtyRef = useRef(false);
  const pushingRef = useRef(false);
  const queuedRef = useRef(false);
  const cloudSaveTimer = useRef(null);
  // Did the previous visit end with changes that never reached the cloud? Read
  // once at start; resolved (keep or discard) on the first successful load.
  const unsavedFromLastTime = useRef(readUnsavedFlag());
  useEffect(() => { dataRef.current = data; }, [data]);
  useEffect(() => {
    dirtyRef.current = dirty;
    // Leave last visit's flag alone until its keep/discard question is settled.
    if (!dirty && unsavedFromLastTime.current) return;
    writeUnsavedFlag(dirty);
  }, [dirty]);

  const settle = () => { cloudReadyRef.current = true; setCloudReady(true); };
  const okStatus = () => setCloudStatus(s => s === 'unsaved' ? s : 'ok');
  // Take the cloud copy as our data, remembering it so the save effect skips it.
  const adoptCloud = (cur) => {
    const d = migrateYearEvents(cur.data);
    syncedRef.current = d;
    cloudStamp.current = cur.savedAt;
    setData(d);
    setDirty(false);
    refreshPhotoIndex(); // another device may have added or removed photos
  };

  const loadingRef = useRef(false); // one load at a time (tab switches fire focus + visibility together)
  const loadFromCloud = async () => {
    const settled = cloudReadyRef.current;
    if (loadingRef.current) return;
    if (settled && dirtyRef.current) return; // local edits pending — the save's own check arbitrates
    if (settled && document.activeElement && document.activeElement.isContentEditable) return; // mid-typing
    loadingRef.current = true;
    try {
      const cur = await Storage.loadCloudData();
      if (cur.status === 'error') { if (!cloudReadyRef.current) setCloudStatus('offline'); return; }
      if (cur.status === 'empty') {
        unsavedFromLastTime.current = false; writeUnsavedFlag(dirtyRef.current);
        settle(); okStatus(); return;
      }
      if (unsavedFromLastTime.current) {
        unsavedFromLastTime.current = false;
        const keep = Storage.peekUploadKey() && await askConfirm({
          title:'Unsaved changes on this device',
          label:'This device has changes that never reached the shared calendar (the last save did not complete).\n"Keep & save" keeps them and saves them now, replacing the cloud copy. "Cancel" discards them and loads the cloud copy.',
          confirm:'Keep & save' });
        if (keep) { cloudStamp.current = cur.savedAt; settle(); okStatus(); setDirty(true); return; }
        writeUnsavedFlag(false);
      }
      if (!settled || cur.savedAt !== cloudStamp.current) adoptCloud(cur);
      settle(); okStatus();
    } finally { loadingRef.current = false; }
  };

  // Write the current data to the cloud. Serialised: a change made while a
  // save is in flight queues one more save afterwards (with the fresh stamp),
  // so two overlapping saves can't trip the conflict check on each other.
  const pushToCloud = async () => {
    const key = Storage.peekUploadKey();
    if (!key || !cloudReadyRef.current) return;
    if (pushingRef.current) { queuedRef.current = true; return; }
    pushingRef.current = true;
    try {
      do {
        queuedRef.current = false;
        const snapshot = dataRef.current;
        if (snapshot === syncedRef.current) { setDirty(false); break; }
        const res = await Storage.saveCloudData(snapshot, key, cloudStamp.current);
        if (res.ok) {
          cloudStamp.current = res.savedAt;
          syncedRef.current = snapshot;
          if (dataRef.current === snapshot) setDirty(false);
          setCloudStatus('ok');
        } else if (res.reason === 'conflict') {
          if (res.cloud) {
            adoptCloud(res.cloud);
            setCloudStatus('ok');
            alert('Another device saved changes after this page loaded, so the newer version has been loaded here and your last change was not kept — please redo it.');
          } else {
            cloudStamp.current = null; // the cloud copy vanished — write ours fresh
            queuedRef.current = true;
          }
        } else if (res.reason === 'unauthorized') {
          // The stored password was rejected (and has been cleared). The change
          // stays local and dirty; the banner offers to re-enter it and retry.
          unlockedRef.current = false;
          setEditMode(false);
          setCloudStatus('unsaved');
          break;
        } else {
          setCloudStatus('unsaved');
          setRetryNonce(n => n + 1);
          break;
        }
      } while (queuedRef.current);
    } finally { pushingRef.current = false; }
  };

  // First load, plus re-sync triggers: tab shown / focused, back online, and a
  // gentle poll while visible. Hiding the tab flushes any pending save at once.
  useEffect(() => {
    loadFromCloud();
    const onVisibility = () => {
      if (document.visibilityState === 'hidden') {
        if (dirtyRef.current) { clearTimeout(cloudSaveTimer.current); pushToCloud(); }
        return;
      }
      loadFromCloud();
    };
    const onFocus = () => loadFromCloud();
    const onOnline = () => { loadFromCloud(); if (dirtyRef.current) pushToCloud(); };
    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('focus', onFocus);
    window.addEventListener('online', onOnline);
    const poll = setInterval(() => { if (document.visibilityState === 'visible') loadFromCloud(); }, 5 * 60 * 1000);
    return () => {
      document.removeEventListener('visibilitychange', onVisibility);

      window.removeEventListener('online', onOnline);
      clearInterval(poll);
    };

  // Push the shared calendar back to the cloud whenever it changes — owner only
  // (whoever holds the upload password), debounced, and never for a data object
  // that itself came from the cloud.
  useEffect(() => {
    if (!cloudReady) return;
    if (data === syncedRef.current) return;
    if (!Storage.peekUploadKey()) return;
    dirtyRef.current = true; // immediately, so a focus-refresh in this tick can't adopt over the edit
    setDirty(true);
    clearTimeout(cloudSaveTimer.current);
    cloudSaveTimer.current = setTimeout(pushToCloud, 800);
    return () => clearTimeout(cloudSaveTimer.current);
  }, [data, cloudReady]);

  // is outstanding keep trying to push (only when a password is held).
  useEffect(() => {
    if (cloudStatus !== 'offline') return;

    return () => clearInterval(t);
  }, [cloudStatus]);
  useEffect(() => {
    if (cloudStatus !== 'unsaved' || !Storage.peekUploadKey()) return;

  }, [cloudStatus, retryNonce]);

  useEffect(() => {

    window.addEventListener('beforeunload', warn);
    return () => window.removeEventListener('beforeunload', warn);
  }, [dirty]);

  // across years; the grid layout (start weekday, day count — Date's 0=Sunday
  // convention, leap years included) and the events are year-specific.
  const yKey = String(viewYear);
  // A month's events in a year, plus the planned trips that touch it (made on
  // the fly from data[0].trips — see tripEventsFor; never stored as events).
  const allEventsFor = (m2, i, y) => eventsFor(m2, y).concat(tripEventsFor(data[0] && data[0].trips, i, y, data));
  const monthForYear = (m2, i) => ({
    ...m2,
    year: viewYear,
    dow: new Date(viewYear, i, 1).getDay(),
    days: new Date(viewYear, i + 1, 0).getDate(),
    events: allEventsFor(m2, i, viewYear),
  });
  // Sunrise/sunset shown for a month (home rows, month header, print): on the
  // 15th of the selected year at the home reference, Hindhead.
  const monthLight = (m2, i) => ({ ...lightAt(HOME_REF.coords[0], HOME_REF.coords[1], viewYear, i, 15), place: HOME_REF.name });
  const lightTitle = (m2, L) => 'Sunrise and sunset on 15 ' + m2.name + ' ' + viewYear + ' at ' + L.place + ' (' + L.zone + ')';

  // ─── Coming up ────────────────────────────────────────────────────────────
  // The next few events from today (real time, whatever year is picked):
  // photo ops, moons, showers, nature windows… across the year boundary. A
  // window already under way shows as "Now".
  const UPCOMING_DAYS = 120;
  const upcoming = useMemo(() => {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const horizon = new Date(today.getTime() + UPCOMING_DAYS * 86400000);
    const items = [];
    [today.getFullYear(), today.getFullYear() + 1].forEach(y => {
      data.forEach((m2, i) => allEventsFor(m2, i, y).forEach(ev => {
        const s = ev.start != null ? ev.start : ev.day, en = ev.end != null ? ev.end : s;
        const startD = new Date(y, i, s), endD = new Date(y, i, en);
        if (endD < today || startD > horizon) return;
        items.push({ ev, y, i, m2, date: startD < today ? today : startD, ongoing: startD < today, end: endD, multi: en !== s, thisYear: y === today.getFullYear() });
      }));
    });
    items.sort((a, b) => (a.date - b.date) || ((a.ongoing ? 0 : 1) - (b.ongoing ? 0 : 1)));
    return items.slice(0, 7);
  }, [data]);

  // ─── Calendar file (.ics) ─────────────────────────────────────────────────
  // The selected year's events as all-day iCalendar entries (photo ops carry
  // the location, its coordinates and the idea), downloaded as one file to
  // import into a phone or desktop calendar.
  const downloadIcs = () => {
    const pad = (n) => String(n).padStart(2, '0');
    const dt = (y, m, d) => y + pad(m + 1) + pad(d);
    const esc = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    const fold = (line) => { const out = []; while (line.length > 73) { out.push(line.slice(0, 73)); line = ' ' + line.slice(73); } out.push(line); return out; };
    const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Photoplan//photoplan.studio//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Photoplan ' + viewYear];
    data.forEach((m2, i) => allEventsFor(m2, i, viewYear).forEach(ev => {
      const s = ev.start != null ? ev.start : ev.day, en = ev.end != null ? ev.end : s;
      const endExcl = new Date(viewYear, i, en + 1); // DTEND is exclusive for all-day events
      const loc = ev.kind === 'photoop' && ev.locId ? m2.locations.find(l => l.id === ev.locId) : null;
      const kindName = KIND_LABEL[ev.kind] || ev.kindLabel || 'Event';
      const desc = [kindName, loc && loc.where, loc && loc.idea, loc && loc.when, 'photoplan.studio'].filter(Boolean).join('\n');
      lines.push('BEGIN:VEVENT', 'UID:' + ev.id + '-' + viewYear + '@photoplan.studio', 'DTSTAMP:' + stamp,
        'DTSTART;VALUE=DATE:' + dt(viewYear, i, s), 'DTEND;VALUE=DATE:' + dt(endExcl.getFullYear(), endExcl.getMonth(), endExcl.getDate()),
        'SUMMARY:' + esc((loc ? 'Photo op: ' : '') + ev.label), 'DESCRIPTION:' + esc(desc));
      const c = loc && coordsOf(loc);
      if (c) { lines.push('GEO:' + c[0] + ';' + c[1]); lines.push('LOCATION:' + esc(loc.name + (loc.where ? ', ' + loc.where : ''))); }
      lines.push('END:VEVENT');
    }));
    lines.push('END:VCALENDAR');
    const text = lines.flatMap(fold).join('\r\n') + '\r\n';
    const url = URL.createObjectURL(new Blob([text], { type: 'text/calendar;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = 'photoplan-' + viewYear + '.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  };
  const mi = Math.min(monthIdx, data.length - 1);
  const month = monthForYear(data[mi], mi);
  const matted = heroFraming === 'Matted print';
  const mapPlaces = useMemo(() => buildMapPlaces(data), [data]);

  // Backfill each built-in location's own map coordinates from the table, so the
  // coordinates field is populated now that the postcode has been retired.
  useEffect(() => {
    setData(prev => {
      let changed = false;
      const d = prev.map(m => ({ ...m, locations: m.locations.map(l => {
        if ((typeof l.lat !== 'number' || typeof l.lng !== 'number') && LOCATION_COORDS[l.id]) {
          changed = true;
          return { ...l, lat: LOCATION_COORDS[l.id][0], lng: LOCATION_COORDS[l.id][1] };
        }
        return l;
      }) }));
      return changed ? d : prev;
    });
  }, []);

  const goToYear = () => { setMapView(false); setPrintView(false); setWeatherView(false); setTripsView(false); setGalleryView(false); setYearView(true); };
  const goToMap = () => { setPrintView(false); setWeatherView(false); setTripsView(false); setGalleryView(false); setMapView(true); };
  const goToPrint = () => { setMapView(false); setWeatherView(false); setTripsView(false); setGalleryView(false); setPrintView(true); };
  const goToWeather = (locId) => { setMapView(false); setPrintView(false); setTripsView(false); setGalleryView(false); setWeatherLoc(locId || null); setWeatherView(true); };
  const goToTrips = (tripId) => { setMapView(false); setPrintView(false); setWeatherView(false); setGalleryView(false); setTripOpen(tripId || null); setTripsView(true); };
  const goToGallery = (tab) => { setMapView(false); setPrintView(false); setWeatherView(false); setTripsView(false); if (tab) setGalleryTab(tab); setGalleryView(true); };
  const goToMonth = (idx, locId) => {
    const m = data[idx];
    if (!m) return;
    setMapView(false);
    setPrintView(false);
    setWeatherView(false);
    setTripsView(false);
    setGalleryView(false);
    setYearView(false);
    setMonthIdx(idx);
    // Only an explicit deep link (year-page row, map card) opens a brief —
    // plain month navigation arrives with every brief closed.
    setSelectedLoc(locId || null);
  };
  const goToJan = () => goToMonth(0, null);
  const changeMonth = (dir) => {
    const n = data.length;
    const pos = yearView ? 0 : (monthIdx + 1);
    const next = (pos + dir + n + 1) % (n + 1);
    setMapView(false);
    setPrintView(false);
    setWeatherView(false);
    setTripsView(false);
    setGalleryView(false);
    if (next === 0) { setYearView(true); return; }
    const idx = next - 1;
    setYearView(false);
    setMonthIdx(idx);
    setSelectedLoc(null);
  };

  // ── Deep links ─────────────────────────────────────────────────────────────
  // The address mirrors the view — #/2026 (home), #/2026/nov, #/2026/nov/<loc>
  // (brief open), #/2026/map, #/2026/weather[/<loc>], #/2026/print — so a
  // month or a location can be shared or bookmarked, and the browser's back
  // button retraces the steps. routeHash() is the address for the current
  // state; applyHash() does the reverse. A location id that isn't in the data
  // yet (a link to a spot added on another device, opened before the cloud
  // copy lands) is kept in the state so the brief opens once the data arrives.
  const routeHash = () => {
    const y = '#/' + viewYear;
    if (galleryView) return y + '/gallery' + (galleryTab === 'review' ? '/review' : '');
    if (tripsView) return y + '/trips' + (tripOpen ? '/' + encodeURIComponent(tripOpen) : '');
    if (weatherView) return y + '/weather' + (weatherLoc ? '/' + encodeURIComponent(weatherLoc) : '');
    if (mapView) return y + '/map';
    if (printView && editMode) return y + '/print';
    if (yearView) return y;
    return y + '/' + data[mi].key + (selectedLoc ? '/' + encodeURIComponent(selectedLoc) : '');
  };
  const routeTitle = () => {
    if (galleryView) return galleryTab === 'review' ? 'Photoplan — ' + viewYear + ' in review' : 'Photoplan — Gallery';
    if (tripsView) return 'Photoplan — Trips';
    if (weatherView) return 'Photoplan — Weather';
    if (mapView) return 'Photoplan — Map';
    if (printView && editMode) return 'Photoplan — ' + viewYear + ' calendar';
    if (yearView) return 'Photoplan — Photo Location Calendar';
    const m2 = data[mi];
    const loc = selectedLoc && m2.locations.find(l => l.id === selectedLoc);
    return 'Photoplan — ' + (loc ? loc.name + ' · ' : '') + m2.name + ' ' + viewYear;
  };
  const applyHash = (hash) => {
    const parts = (hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch (_) { return s; } });
    let i = 0;
    const y = parseInt(parts[0], 10);
    if (!isNaN(y) && YEARS.indexOf(y) !== -1) { setViewYear(y); i = 1; }
    const seg = parts[i];
    if (!seg) { goToYear(); return; }
    if (seg === 'map') { goToMap(); return; }
    if (seg === 'weather') { goToWeather(parts[i + 1] || null); return; }
    if (seg === 'trips') { goToTrips(parts[i + 1] || null); return; }
    if (seg === 'gallery') { goToGallery(parts[i + 1] === 'review' ? 'review' : 'photos'); return; }
    if (seg === 'print') { if (Storage.peekUploadKey()) { setEditMode(true); goToPrint(); } else goToYear(); return; } // owner only
    const idx = data.findIndex(m2 => m2.key === seg);
    if (idx !== -1) { goToMonth(idx, parts[i + 1] || null); return; }
    goToYear();
  };
  const applyHashRef = useRef(applyHash);
  applyHashRef.current = applyHash;
  // On arrival, open whatever the address says; afterwards follow the back/
  // forward buttons (our own pushState calls don't fire hashchange).
  useEffect(() => {
    if (location.hash) applyHashRef.current(location.hash);
    const onHash = () => applyHashRef.current(location.hash);
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  // State → address (+ tab title). The first run only fills in a missing
  // hash, without a history entry; an arrival hash is left for applyHash
  // (its state lands on the next commit and then already matches).
  const routeStarted = useRef(false);
  useEffect(() => {
    const h = routeHash();
    document.title = routeTitle();
    if (!routeStarted.current) {
      routeStarted.current = true;
      if (!location.hash) history.replaceState(null, '', h);
      return;
    }
    if (location.hash !== h) history.pushState(null, '', h);
  }, [viewYear, yearView, mapView, printView, weatherView, weatherLoc, tripsView, tripOpen, galleryView, galleryTab, mi, selectedLoc, editMode]);

  // ── Search ─────────────────────────────────────────────────────────────────
  // A quick find across every location (name first, then tag, where, idea,
  // when, kit, notes, links); picking a hit opens that month with the brief.
  const [query, setQuery] = useState('');
  const [searchOpen, setSearchOpen] = useState(false);
  const [hitIdx, setHitIdx] = useState(0);
  const searchRef = useRef(null);
  const searchHits = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (q.length < 2) return [];
    const hits = [];
    data.forEach((m2, i) => m2.locations.forEach(loc => {
      const name = (loc.name || '').toLowerCase();
      const rest = [loc.tag, loc.where, loc.idea, loc.when, loc.kit, loc.notes, loc.links].map(s => (s || '').toLowerCase()).join(' ');
      const score = name.startsWith(q) ? 3 : name.includes(q) ? 2 : rest.includes(q) ? 1 : 0;
      if (score) hits.push({ loc, month: m2, monthIdx: i, score });
    }));
    hits.sort((a, b) => b.score - a.score || a.monthIdx - b.monthIdx);
    return hits.slice(0, 8);
  }, [data, query]);
  // "/" anywhere (outside a field) jumps to the search box.
  useEffect(() => {
    const onKey = (ev) => {
      if (ev.key !== '/' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
      const t = ev.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
      if (searchRef.current) { ev.preventDefault(); searchRef.current.focus(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // Editing is gated behind the upload password. The first time someone tries to
  // change anything, they're asked for it; enter it once and everything's
  // editable (and syncs). Leave it blank and it's view-only — the change is
  // blocked. A device that already holds the password never gets asked.
  const ensureUnlocked = (retry) => {
    // No edits until the cloud copy has been read: an edit made on top of a
    // stale local cache would overwrite whatever is really in the cloud.
    if (!cloudReadyRef.current) {
      alert(cloudStatus === 'offline'
        ? 'The shared calendar can\'t be reached right now, so editing is paused and that change was not made. It reconnects automatically — try again once the warning at the top has gone.'
        : 'Still loading the shared calendar — try again in a moment.');
      return false;
    }
    if (unlockedRef.current || Storage.peekUploadKey()) { unlockedRef.current = true; return true; }
    // Not unlocked yet: ask with the in-app dialog (asynchronous, unlike the old
    // browser prompt) and run `retry` once the password is in. Callers treat
    // the `false` as "not now" and simply return.
    askText({ kind:'password', title:'Edit password', label:'Enter the edit password to make changes.', placeholder:'Password', hint:'Just looking? Cancel keeps everything view-only.', confirm:'Unlock' }).then(entered => {
      const k = (entered || '').trim();
      if (!k) return;
      Storage.setUploadKey(k);
      unlockedRef.current = true;
      setEditMode(true);
      if (retry) retry();
    });
    return false;
  };

  const mutateData = (fn) => {
    if (!ensureUnlocked(() => mutateData(fn))) return;
    setData(prev => { const d = prev.map(m => ({ ...m, locations: m.locations.map(l => ({ ...l })), eventsByYear: Object.keys(m.eventsByYear || {}).reduce((o, y) => { o[y] = m.eventsByYear[y].map(e2 => ({ ...e2 })); return o; }, {}), ...(m.annualEvents ? { annualEvents: m.annualEvents.map(e2 => ({ ...e2 })) } : {}) })); fn(d); return d; });
  };

  // Toggle a location's "done"/visited state wherever it lives (used by the map,
  // whose pins can belong to any month, not just the current one).
  const toggleVisitedById = (locId) => {
    mutateData(d => { for (const m of d) { const loc = m.locations.find(l => l.id === locId); if (loc) { loc.done = !loc.done; break; } } });
  };

  // Create a location in a month (the shared part of "+ Add location" and the
  // Trips page's "New location in…"); returns its id. Readable, unique id
  // from the name — it becomes part of the photo filename.
  const createLocation = (idx, name) => {
    const existing = new Set(data.flatMap(m => m.locations.map(l => l.id)));
    const slugBase = slugify(name) || 'location';
    let id = slugBase, n = 2;
    while (existing.has(id)) { id = slugBase + '-' + (n++); }
    mutateData(d => {
      d[idx].locations.push({ id, region:'UK', name, tag:'New spot', done:false, where:'Where is it?', idea:'Describe the shot you have in mind — what makes this spot worth the trip.', when:'Best season, time of day and conditions to aim for.', kit:'Lens · Tripod' });
    });
    return id;
  };
  const addLocation = async () => {
    if (!ensureUnlocked(addLocation)) return;
    const nameInput = await askText({ kind:'text', title:'New location', label:'Name the new location — it will be added to ' + month.name + '.', placeholder:'e.g. Buttermere', confirm:'Add location' });
    if (nameInput === null) return; // cancelled
    setSelectedLoc(createLocation(monthIdx, nameInput.trim() || 'New location'));
  };

  const deleteLocation = async (id) => {
    if (!ensureUnlocked(() => deleteLocation(id))) return;
    const target = month.locations.find(l => l.id === id);
    const name = target ? target.name : 'this location';
    // Irreversible (the photos go too), so confirm.
    const sure = await askConfirm({ title:'Delete location', label:'Delete "' + name + '" from ' + month.name + '?\nIts photos will be removed from the cloud as well. This cannot be undone.', confirm:'Delete location', danger:true });
    if (!sure) return;
    // Also remove every photo of this location (all sizes) from R2, so deleting
    // a spot doesn't leave orphaned images in the bucket.
    const key = Storage.peekUploadKey();
    if (key && target) locPhotos(target).forEach(p => Storage.removePhotoVariants(slotBase(month.key, id, p.slot), key));
    mutateData(d => {
      const locs = d[monthIdx].locations;
      const i = locs.findIndex(l => l.id === id);
      if (i !== -1) locs.splice(i, 1);
    });
    setSelectedLoc(null); // briefs stay closed unless deliberately opened
  };

  // Move a location (with its photo, ticks and coordinates) to another month.
  // The R2 image is keyed by month, so it's copied to the new month's name
  // before the old copies are deleted; the calendar data moves the location
  // object itself. Ends by jumping to the destination month with the brief
  // open, so the move is visible.
  const moveLocation = async (locId, toIdx) => {
    if (toIdx === monthIdx || toIdx < 0 || toIdx >= data.length) return;
    if (!ensureUnlocked(() => moveLocation(locId, toIdx))) return;
    const loc = month.locations.find(l => l.id === locId);
    if (!loc) return;
    if (data[toIdx].locations.some(l => l.id === locId)) {
      alert(data[toIdx].name + ' already has this location — it appears in both months, so there is nothing to move.');
      return;
    }
    const key = Storage.peekUploadKey();
    if (key) for (const p of locPhotos(loc)) await Storage.movePhotoVariants(slotBase(month.key, locId, p.slot), slotBase(data[toIdx].key, locId, p.slot), key);
    mutateData(d => {
      const fromArr = d[monthIdx].locations;
      const i = fromArr.findIndex(l => l.id === locId);
      if (i === -1) return;
      const [moved] = fromArr.splice(i, 1);
      d[toIdx].locations.push(moved);
      // focus points follow the photos to their new storage names
      if (d[0].photoFocus) {
        const next = { ...d[0].photoFocus };
        locPhotos(moved).forEach(p => { const from = slotBase(d[monthIdx].key, locId, p.slot), to = slotBase(d[toIdx].key, locId, p.slot); if (next[from]) { next[to] = next[from]; delete next[from]; } });
        d[0].photoFocus = next;
      }
    });
    bumpImg();
    goToMonth(toIdx, locId);
  };

  const toggleRegion = (id) => {
    mutateData(d => {
      const loc = d[monthIdx].locations.find(l => l.id === id);
      if (loc) loc.region = loc.region === 'UK' ? 'INT' : 'UK';
    });
  };

  const toggleDone = (id) => {
    mutateData(d => {
      const loc = d[monthIdx].locations.find(l => l.id === id);
      if (loc) loc.done = !loc.done;
    });
  };

  const reorderLoc = (fromId, toId) => {
    if (!fromId || fromId === toId) return;
    mutateData(d => {
      const arr = d[monthIdx].locations;
      const fromI = arr.findIndex(l => l.id === fromId);
      const toI = arr.findIndex(l => l.id === toId);
      if (fromI === -1 || toI === -1) return;
      const [moved] = arr.splice(fromI, 1);
      arr.splice(toI, 0, moved);
    });
  };

  const editField = (locId, field, value) => {
    mutateData(d => {
      const loc = d[monthIdx].locations.find(l => l.id === locId);
      if (loc) loc[field] = value;
    });
  };

  const editMonthField = (field, value) => {
    mutateData(d => { d[monthIdx][field] = value; });
  };

  // The home page intro lives on the first month's object (see
  // DEFAULT_YEAR_INTRO). A deliberate blank stays blank — only an
  // untouched calendar shows the default copy.
  const yearIntro = (data[0] && data[0].yearIntro != null) ? data[0].yearIntro : DEFAULT_YEAR_INTRO;
  const editYearIntro = (t) => mutateData(d => { d[0].yearIntro = t; });

  // The map page intro, stored the same way (the default adapts its hover/tap
  // wording to the device; an edited text is shown verbatim everywhere).
  const mapIntro = (data[0] && data[0].mapIntro != null) ? data[0].mapIntro
    : "Every shoot in the calendar on one map — UK spots in green, the international trips in terracotta. Filter by region, month or whether you've ticked it off, then " + (isMobile ? 'tap' : 'hover') + ' a pin for the details.';
  const editMapIntro = (t) => mutateData(d => { d[0].mapIntro = t; });

  // Star a location for the printable calendar: its photo fronts this month's
  // printed page. One per month, stored on the month itself (cloud-synced);
  // starring another location moves the star, starring again clears it (back
  // to the default first-location-with-a-photo).
  const togglePrintStar = (locId) => {
    mutateData(d => { const m2 = d[monthIdx]; m2.printLoc = m2.printLoc === locId ? undefined : locId; });
  };

  // ── A location's photos (see locPhotos) ───────────────────────────────────
  // Each photo's caption year. Slot 1 also keeps the legacy loc.photoYear in step.
  const setPhotoYear = (locId, slot, year) => {
    const y = (year || '').trim();
    mutateData(d => {
      const loc = d[monthIdx].locations.find(l => l.id === locId); if (!loc) return;
      if (Array.isArray(loc.photos) && loc.photos.length) { const p = loc.photos.find(x => x.slot === slot); if (p) p.year = y; }
      if (slot === 1) loc.photoYear = y;
    });
  };
  // Called once an extra photo has landed in R2: record it (the list is
  // materialised from the legacy single photo on first use).
  const addPhotoSlot = (locId, slot) => mutateData(d => {
    const loc = d[monthIdx].locations.find(l => l.id === locId); if (!loc) return;
    const list = locPhotos(loc).map(p => ({ ...p }));
    if (!list.some(p => p.slot === slot)) list.push({ slot, year: '' });
    loc.photos = list;
  });
  // Called once a photo has been removed from R2. Removing the main photo
  // promotes the next one; an emptied list reverts to the legacy shape.
  const removePhotoSlot = (locId, slot) => mutateData(d => {
    const loc = d[monthIdx].locations.find(l => l.id === locId); if (!loc) return;
    const list = locPhotos(loc).filter(p => p.slot !== slot).map(p => ({ ...p }));
    if (list.length) { loc.photos = list; loc.photoYear = list[0].year || ''; } else { delete loc.photos; }
  });
  // The Weather page's default location (owner-set, cloud-synced).
  const setWeatherDefault = (locId) => mutateData(d => { if (locId) d[0].weatherDefault = locId; else delete d[0].weatherDefault; });

  // ── Trips, shot lists, tides flag ───────────────────────────────────────────
  // Every location by id (with its month), for the Trips page and kit import.
  const locIndex = useMemo(() => { const o = {}; data.forEach((m2, i) => m2.locations.forEach(l => { o[l.id] = { loc: l, month: m2, i }; })); return o; }, [data]);
  const trips = (data[0] && data[0].trips) || [];
  const tripsOf = (d) => (d[0].trips || []);
  const addTrip = async () => {
    if (!ensureUnlocked(addTrip)) return;
    const name = await askText({ kind:'text', title:'New trip', label:'Name the trip — a place or a weekend, e.g. "Skye in March". Dates, locations and the packing list come next.', placeholder:'e.g. Northumberland coast', confirm:'Create trip' });
    if (name === null) return;
    const id = newId('trip');
    const template = (data[0] && data[0].packingTemplate) || '';
    mutateData(d => { d[0].trips = tripsOf(d).concat([{ id, name: name.trim() || 'Trip', start:'', end:'', locIds: [], notes:'', packing: packingFromTemplate(template) }]); });
    setTripOpen(id);
  };
  // patch = object or (trip) => object; trips and their lists are always replaced, never mutated.
  const updateTrip = (id, patch) => mutateData(d => { d[0].trips = tripsOf(d).map(t => t.id === id ? { ...t, ...(typeof patch === 'function' ? patch(t) : patch) } : t); });
  const deleteTrip = async (id) => {
    const t = trips.find(x => x.id === id); if (!t) return;
    const yes = await askConfirm({ title:'Delete this trip?', label:'"' + t.name + '" and its packing list will be removed. The locations themselves stay in the calendar.', confirm:'Delete trip', danger:true });
    if (!yes) return;
    mutateData(d => { d[0].trips = tripsOf(d).filter(x => x.id !== id); });
    if (tripOpen === id) setTripOpen(null);
  };
  // Dates keep end ≥ start: moving one past the other drags the other along.
  const setTripDates = (id, start, end) => updateTrip(id, t => {
    let s = start != null ? start : (t.start || ''), en = end != null ? end : (t.end || '');
    if (s && !en) en = s;
    if (s && en && en < s) { if (end != null) s = en; else en = s; }
    return { start: s, end: en };
  });
  const addTripLoc = (id, locId) => updateTrip(id, t => ({ locIds: (t.locIds || []).includes(locId) ? t.locIds : (t.locIds || []).concat([locId]) }));
  // A brand-new location straight from the trip: named in the dialog, created
  // in the chosen month, then added to the trip.
  const addNewLocToTrip = async (id, idx) => {
    if (!ensureUnlocked(() => addNewLocToTrip(id, idx))) return;
    const nameInput = await askText({ kind:'text', title:'New location', label:'Name the new location — it will be added to ' + data[idx].name + ' and to this trip. Fill in its brief from the month page.', placeholder:'e.g. Buttermere', confirm:'Add location' });
    if (nameInput === null) return;
    addTripLoc(id, createLocation(idx, nameInput.trim() || 'New location'));
  };
  // When a trip is, relative to today: 'past' | 'now' | 'tomorrow' | 'in N days' | null (undated).
  const tripWhen = (t) => {
    const now = new Date(), todayUtc = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = (ymd) => { const p = parseYmd(ymd); return p ? Math.round((Date.UTC(p.y, p.m, p.d) - todayUtc) / 86400000) : null; };
    const d0 = diff(t.start), d1 = diff(t.end || t.start);
    if (d0 == null) return null;
    if (d1 < 0) return 'past';
    if (d0 <= 0) return 'now';
    if (d0 === 1) return 'tomorrow';
    return 'in ' + d0 + ' days';
  };
  const whenBadge = (w) => w && e('span', { style:{ fontFamily:"'IBM Plex Mono',monospace", fontSize:9.5, letterSpacing:'.12em', textTransform:'uppercase', padding:'3px 8px', background: w === 'now' ? '#54632F' : (w === 'past' ? '#EFE7D2' : '#DCE3E8'), color: w === 'now' ? '#FBF7EC' : (w === 'past' ? '#9C8F71' : '#2E4A5C') } }, w);
  const removeTripLoc = (id, locId) => updateTrip(id, t => ({ locIds: (t.locIds || []).filter(x => x !== locId) }));
  const togglePacking = (id, itemId) => updateTrip(id, t => ({ packing: (t.packing || []).map(p => p.id === itemId ? { ...p, done: !p.done } : p) }));
  const addPacking = (id, text) => updateTrip(id, t => ({ packing: (t.packing || []).concat([{ id: newId('p'), text, done: false }]) }));
  const removePacking = (id, itemId) => updateTrip(id, t => ({ packing: (t.packing || []).filter(p => p.id !== itemId) }));
  const untickPacking = (id) => updateTrip(id, t => ({ packing: (t.packing || []).map(p => ({ ...p, done: false })) }));
  const resetPacking = async (id) => {
    const yes = await askConfirm({ title:'Reset the packing list?', label:"Replaces this trip's list with your usual packing list, everything unticked.", confirm:'Reset list' });
    if (yes) updateTrip(id, { packing: packingFromTemplate(data[0] && data[0].packingTemplate) });
  };
  // Add the kit named on the trip's locations (their Kit chips) to the packing list, skipping what's there.
  const addKitToPacking = (id) => updateTrip(id, t => {
    const have = new Set((t.packing || []).map(p => p.text.trim().toLowerCase()));
    const extra = [];
    (t.locIds || []).forEach(lid => {
      const hit = locIndex[lid]; if (!hit) return;
      (hit.loc.kit || '').split(/\s*[·•,;|]\s*|\n/).map(s => s.trim()).filter(Boolean).forEach(k => { const key = k.toLowerCase(); if (!have.has(key)) { have.add(key); extra.push({ id: newId('p'), text: k, done: false }); } });
    });
    return { packing: (t.packing || []).concat(extra) };
  });
  const setPackingTemplate = (text) => mutateData(d => { if ((text || '').trim()) d[0].packingTemplate = text; else delete d[0].packingTemplate; });
  // Shot lists live on the location (loc.shots); always a fresh array.
  const updateShots = (locId, fn) => mutateData(d => { for (const m2 of d) { const loc = m2.locations.find(l => l.id === locId); if (loc) { loc.shots = fn(loc.shots || []); break; } } });
  const addShot = (locId, text) => updateShots(locId, s => s.concat([{ id: newId('s'), text, done: false }]));
  const toggleShot = (locId, shotId) => updateShots(locId, s => s.map(x => x.id === shotId ? { ...x, done: !x.done } : x));
  const removeShot = (locId, shotId) => updateShots(locId, s => s.filter(x => x.id !== shotId));
  // ── Places, visits, photo tags, areas ───────────────────────────────────────
  const places = useMemo(() => placeGroups(data), [data]);
  // Every photo in the calendar (the gallery's raw list): one entry per slot
  // that exists in the photo index (all slots while the index is unknown).
  const galleryItems = useMemo(() => {
    const out = [];
    data.forEach((m2, i) => m2.locations.forEach(loc => locPhotos(loc).forEach(p => {
      const base = slotBase(m2.key, loc.id, p.slot);
      if (photoIndex && !photoIndex.has(base + '-thumb')) return;
      out.push({ key: base, base, i, month: m2, loc, slot: p.slot, year: (p.year || '').trim(), tags: p.tags || [], starred: m2.printLoc === loc.id, caption: photoCaption(loc, m2.name, p.year) });
    })));
    return out;
  }, [data, photoIndex]);
  // A visit: date + a short note, newest first. The log is per location.
  const addVisit = (locId, date, note) => {
    const d = parseYmd(date) ? date : todayYmd();
    mutateData(dd => { for (const m2 of dd) { const loc = m2.locations.find(l => l.id === locId); if (loc) { loc.visits = (loc.visits || []).concat([{ id: newId('v'), date: d, note: (note || '').trim() }]).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0); break; } } });
    setVisitNote('');
  };
  const removeVisit = (locId, id) => mutateData(dd => { for (const m2 of dd) { const loc = m2.locations.find(l => l.id === locId); if (loc) { loc.visits = (loc.visits || []).filter(v => v.id !== id); break; } } });
  // Tags on one photo (materialises the photo list of a legacy single-photo location).
  const setPhotoTags = (locId, slot, tags) => mutateData(dd => {
    for (const m2 of dd) {
      const loc = m2.locations.find(l => l.id === locId); if (!loc) continue;
      const list = locPhotos(loc).map(p => ({ ...p }));
      const p = list.find(x => x.slot === slot);
      if (p) { if (tags.length) p.tags = tags; else delete p.tags; loc.photos = list; }
      break;
    }
  });
  // Star for print from anywhere (the tile's ★ uses the current month).
  const togglePrintStarIn = (i, locId) => mutateData(dd => { const m2 = dd[i]; m2.printLoc = m2.printLoc === locId ? undefined : locId; });
  // Fill in area + country for every location with coordinates that lacks
  // one, from Nominatim — sequential, with a progress count; typed values win.
  const fillAreas = async () => {
    if (!ensureUnlocked(fillAreas)) return;
    const todo = [];
    data.forEach(m2 => m2.locations.forEach(l => { const c = coordsOf(l); if (c && (!(l.area || '').trim() || !(l.country || '').trim())) todo.push({ id: l.id, c }); }));
    if (!todo.length) { showNotice('Every location with coordinates already has an area and a country.'); return; }
    setGeocoding({ done: 0, total: todo.length });
    const results = {};
    for (let k = 0; k < todo.length; k++) {
      try { results[todo[k].id] = await lookupArea(todo[k].c[0], todo[k].c[1]); } catch (_) {}
      setGeocoding({ done: k + 1, total: todo.length });
      if (k < todo.length - 1) await new Promise(r => setTimeout(r, 1100));
    }
    setGeocoding(null);
    let filled = 0, missed = 0;
    data.forEach(m2 => m2.locations.forEach(l => { const r = results[l.id]; if (!r) { if (todo.some(t => t.id === l.id)) missed++; return; } if (!(l.area || '').trim() && r.area) filled++; if (!(l.country || '').trim() && r.country) filled++; }));
    mutateData(dd => dd.forEach(m2 => m2.locations.forEach(l => { const r = results[l.id]; if (!r) return; if (!(l.area || '').trim() && r.area) l.area = r.area; if (!(l.country || '').trim() && r.country) l.country = r.country; })));
    showNotice(filled ? 'Filled in ' + filled + ' area and country names from OpenStreetMap' + (missed ? ' (' + missed + ' lookups failed — try again later)' : '') + '.' : 'OpenStreetMap could not be reached — try again in a moment.');
  };
  // Coastal spots show the Tides row (owner switch, cloud-synced).
  const setLocTidal = (locId, on) => mutateData(d => { for (const m2 of d) { const loc = m2.locations.find(l => l.id === locId); if (loc) { if (on) loc.tidal = true; else delete loc.tidal; break; } } });
  // A photo's focus point (see FocusCtx): fx/fy as fractions, or null to reset
  // to the centre. Keyed by the photo's storage base in data[0].photoFocus.
  const setPhotoFocus = (base, fx, fy) => mutateData(d => {
    const m = { ...(d[0].photoFocus || {}) };
    if (fx == null) delete m[base]; else m[base] = [Math.round(fx * 1000) / 1000, Math.round(fy * 1000) / 1000];
    d[0].photoFocus = m;
  });
  // After an upload: fill in what the photo itself knows (readPhotoInfo) —
  // its capture year as the caption year if that slot has none, and its GPS

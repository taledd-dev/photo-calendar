  // spots always have some, so this is for the owner's added locations). The
  // owner is told what was filled in; nothing already set is touched.
  const applyPhotoInfo = (locId, slot, info) => {
    if (!info) return;
    const cur = data[mi].locations.find(l => l.id === locId); if (!cur) return;
    const p = locPhotos(cur).find(x => x.slot === slot);
    const fillYear = !!info.year && (!p || !(p.year || '').trim());
    const fillCoords = typeof info.lat === 'number' && typeof info.lng === 'number' && !coordsOf(cur);
    if (!fillYear && !fillCoords) return;
    mutateData(d => {
      const loc = d[monthIdx].locations.find(l => l.id === locId); if (!loc) return;
      if (fillYear) {
        if (Array.isArray(loc.photos) && loc.photos.length) { const q = loc.photos.find(x => x.slot === slot); if (q && !(q.year || '').trim()) q.year = info.year; }
        if (slot === 1 && !(loc.photoYear || '').trim()) loc.photoYear = info.year;
      }
      if (fillCoords && !coordsOf(loc)) {
        loc.lat = info.lat; loc.lng = info.lng;

      }
    });
    const filled = [];

    if (fillCoords) filled.push('the map coordinates');

  };
  // Make an extra the main photo (tiles, print, the brief) — a reorder only.
  const makeMainPhoto = (locId, slot) => mutateData(d => {
    const loc = d[monthIdx].locations.find(l => l.id === locId); if (!loc) return;
    const list = locPhotos(loc).map(p => ({ ...p }));
    const i = list.findIndex(p => p.slot === slot); if (i <= 0) return;
    const [pick] = list.splice(i, 1);

  // Set a location's map coordinates from pasted "latitude, longitude" text.
  // Clearing the field removes them (so it falls back to any built-in coords).
  const setLocCoords = (locId, text) => {
    const nums = (text || '').split(/[,\s]+/).map(x => parseFloat(x)).filter(x => !isNaN(x));
    const has = nums.length >= 2;
    mutateData(d => {
      for (const m of d) {
        const loc = m.locations.find(l => l.id === locId);
        if (loc) {

            // override it afterwards.

  const setLocParking = (locId, text) => {
    const nums = (text || '').split(/[,\s]+/).map(x => parseFloat(x)).filter(x => !isNaN(x));
    mutateData(d => {
      for (const m of d) {

  // The Light and Sky rows and the mini map's direction rays describe one day
  // of this month in the selected year: the location's photo-op day if one is
  // scheduled, else the 15th; the ‹ › stepper picks any other (reset when the
  // location, month or year changes). `sky` is skyAt() for that day and
  // `coreSeason` the months (by their 15th) when the Milky Way core gets a

    else { pLabel = (draft.label && draft.label.trim()) ? draft.label : 'Untitled event'; }

  }

  const totalLocs = data.reduce((a, m2) => a + m2.locations.length, 0);
  const ukLocs = data.reduce((a, m2) => a + m2.locations.filter(l => l.region === 'UK').length, 0);

  // ─── Render ────────────────────────────────────────────────────────────────

  const BtnBase = { height:40, border:'1px solid #2A251E', cursor:'pointer', fontFamily:"'IBM Plex Mono',monospace", fontSize:11, letterSpacing:'.12em', textTransform:'uppercase', boxShadow:'3px 3px 0 rgba(42,37,30,0.12)' };

  const nextBtn = e('button', { className:'btn-hover', onClick:()=>changeMonth(1), title:'Next month', 'aria-label':'Next month', style:WhiteBtn }, '›');
  const mapBtn = e('button', { className:'btn-hover', onClick:goToMap, style:{ ...BtnBase, background:'#FBF7EC', color:'#2A251E', display:'inline-flex', alignItems:'center', gap:7, padding:'0 15px' } }, e('span', { style:{ fontSize:14, lineHeight:1, marginTop:-1, color:'#54632F' } }, '◍'), ' Map');
  const printBtn = e('button', { className:'btn-hover', onClick:goToPrint, title:'The printable wall calendar for the selected year', style:{ ...BtnBase, background:'#FBF7EC', color:'#2A251E', display:'inline-flex', alignItems:'center', gap:7, padding:'0 15px' } }, e('span', { style:{ fontSize:13, lineHeight:1, marginTop:-1, color:'#54632F' } }, '⎙'), ' Calendar');
  const weatherBtn = e('button', { className:'btn-hover', onClick:()=>goToWeather(null), title:'Forecasts for each location, and the conditions each kind of shoot wants', style:{ ...BtnBase, background:'#FBF7EC', color:'#2A251E', display:'inline-flex', alignItems:'center', gap:7, padding:'0 15px' } }, e('span', { style:{ fontSize:14, lineHeight:1, marginTop:-1, color:'#54632F' } }, '☁'), ' Weather');
  const tripsBtn = e('button', { className:'btn-hover', onClick:()=>goToTrips(null), title:'Planned trips — dates, locations, shot lists and packing lists', style:{ ...BtnBase, background:'#FBF7EC', color:'#2A251E', display:'inline-flex', alignItems:'center', gap:7, padding:'0 15px' } }, e('span', { style:{ fontSize:11, lineHeight:1, marginTop:-1, color:'#3F6A80' } }, '▲'), ' Trips');
  const galleryBtn = e('button', { className:'btn-hover', onClick:()=>goToGallery(null), title:'Every photo, grouped by place, area, month, tag… and the year in review', style:{ ...BtnBase, background:'#FBF7EC', color:'#2A251E', display:'inline-flex', alignItems:'center', gap:7, padding:'0 15px' } }, e('span', { style:{ fontSize:13, lineHeight:1, marginTop:-1, color:'#54632F' } }, '▦'), ' Gallery');
  const icsBtn = e('button', { className:'btn-hover', onClick:downloadIcs, title:'Export the ' + viewYear + ' events as a calendar file (.ics) for your phone or desktop calendar', style:{ ...BtnBase, background:'#FBF7EC', color:'#2A251E', display:'inline-flex', alignItems:'center', gap:7, padding:'0 15px' } }, e('span', { style:{ fontSize:13, lineHeight:1, marginTop:-1, color:'#54632F' } }, '⤓'), ' Export');
  // Month view keeps both arrows; the year view drops the right arrow (it's the

  const navRowStyle = { display:'flex', gap:9, alignItems:'center', ...(isMobile ? { flexWrap:'wrap', gap:8 } : {}) };
  const navDivider = () => isMobile ? null : e(Divider);
  // Month picker — a native <select> dressed as one of the nav buttons, so on a

    e('select', { value: mi, onChange: (ev) => { const v = parseInt(ev.target.value, 10); if (!isNaN(v)) goToMonth(v, null); }, 'aria-label':'Go to month', title:'Jump to a month',
      style:{ ...BtnBase, appearance:'none', WebkitAppearance:'none', MozAppearance:'none', background:'#FBF7EC', color:'#2A251E', padding:'0 32px 0 15px', borderRadius:0 } },
      data.map((m2, i) => e('option', { key:m2.key, value:i }, m2.name))),

  );
  // Month page: month picker + arrows | Map | Weather | Home (Add location

  const navRow = (showYearBtn) => showYearBtn
    ? e('div', { style:navRowStyle },
        monthPicker(), prevBtn, nextBtn, navDivider(), mapBtn, weatherBtn, tripsBtn, galleryBtn, navDivider(),
        e('button', { className:'btn-hover', onClick:goToYear, style:{ ...GreenBtn, gap:9 } }, e('span', { style:{ fontSize:15, lineHeight:1, marginTop:-1 } }, '←'), ' Home')
      )
    : e('div', { style:navRowStyle },
        prevBtn,
        e('button', { className:'btn-hover', onClick:goToJan, style:GreenBtn }, 'January ', e('span', { style:{ fontSize:15, lineHeight:1, marginTop:-1 } }, '→'))
      );
  // The search box, dressed as one of the nav buttons, with its hits in a
  // dropdown (mouse, or ↑ ↓ Enter; Escape clears). Hits open the location.
  const searchBox = () => {
    const mono = "'IBM Plex Mono',monospace";
    const showHits = searchOpen && query.trim().length >= 2;
    const pick = (h) => { setQuery(''); setSearchOpen(false); if (searchRef.current) searchRef.current.blur(); goToMonth(h.monthIdx, h.loc.id); };
    const cur = Math.min(hitIdx, Math.max(0, searchHits.length - 1));
    return e('div', { style:{ position:'relative', display:'inline-flex', ...(isMobile ? { width:'100%' } : {}) } },
      e('span', { 'aria-hidden':'true', style:{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)', pointerEvents:'none', fontSize:15, color:'#54632F', lineHeight:1 } }, '⌕'),
      e('input', { ref: searchRef, type:'search', value: query, placeholder:'Find a location', 'aria-label':'Find a location', autoComplete:'off', spellCheck:false,
        onChange: (ev) => { setQuery(ev.target.value); setHitIdx(0); setSearchOpen(true); },

          else if (ev.key === 'ArrowUp' && searchHits.length) { ev.preventDefault(); setHitIdx((cur - 1 + searchHits.length) % searchHits.length); }

            (() => { const L = monthLight(m2, i); return e('div', { style:{ color:'#54632F' } }, '↑ ' + L.rise + '   ↓ ' + L.set); })(),
            e('div', null, m2.daylightNote)
          )
        ),
        // the grid takes the rest of the page; week rows share it equally
        e('div', { style:{ flex:1, minHeight:0, display:'flex', flexDirection:'column', border:'1px solid #C9BD9F' } },
          e('div', { style:{ flex:'none', display:'grid', gridTemplateColumns:'repeat(7,1fr)', borderBottom:'1px solid #D2C7AC', background:'#F4EEDE' } },
            dayNames.map((c, ci) => e('div', { key:ci, style:{ padding:'1.8mm 0', textAlign:'center', fontFamily:mono, fontSize:'3mm', letterSpacing:'.12em', textTransform:'uppercase', color:'#9C8F71' } }, c))
          ),
          wks.map((wk, wi) =>
            e('div', { key:wi, style:{ flex:1, minHeight:0, position:'relative', display:'grid', gridTemplateColumns:'repeat(7,1fr)', borderBottom: wi < wks.length - 1 ? '1px solid #E2D9C2' : 'none', backgroundImage:'repeating-linear-gradient(to right,#ECE3CD 0,#ECE3CD 1px,transparent 1px,transparent 14.2857%)', overflow:'hidden' } },
              wk.days.map((d, di) =>
                e('div', { key:di, style:{ padding:'1.6mm 2mm', minWidth:0 } },
                  d.inMonth && e('div', { style:{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:'1mm', minWidth:0 } },
                    e('span', { style:{ fontFamily:mono, fontSize:'3.6mm', fontWeight:500, color:'#7A6F58', flex:'none' } }, d.day),
                    // wraps so two names on one date stack on a second line
                    d.icons.length > 0 && e('div', { style:{ display:'flex', flexWrap:'wrap', alignItems:'center', justifyContent:'flex-end', gap:'0.6mm 1.2mm', minWidth:0, overflow:'hidden' } },
                      d.icons.map(ic => e('span', { key:ic.ev.id, style:{ display:'inline-flex', alignItems:'center', gap:'1mm', minWidth:0, maxWidth:'100%', color:ic.accent } },
                        ic.icon && e(EventIcon, { name:ic.icon, size:'4mm' }),
                        ic.text && e('span', { style:{ fontFamily:mono, fontSize:'2.6mm', color:'#5A513B', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', minWidth:0 } }, ic.text)))
                    )
                  )
                )
              ),
              wk.items.map(it =>
                e('div', { key:it.id, style:{ position:'absolute', left:it.left, width:it.width, top:it.top, height:21, display:'flex', alignItems:'center', gap:5, padding:'0 6px', background:it.bg, color:it.fg, borderLeft:'3px solid '+it.accent, borderRadius:2, fontFamily:mono, fontSize:10.5, fontWeight:500, lineHeight:1.4, whiteSpace:'nowrap', overflow:'hidden' } },
                  it.hasGlyph && e('span', { style:{ flex:'none' } }, it.glyph),
                  e('span', { style:{ overflow:'hidden', textOverflow:'ellipsis' } }, it.label),
                  it.contRight && e('span', { style:{ flex:'none', marginLeft:'auto', paddingLeft:3 } }, '→')
                )
              )
            )
          )
        ),
        // footer: key to the event types on this page | Instagram handle
        e('div', { style:{ flex:'none', display:'flex', alignItems:'center', justifyContent:'space-between', gap:'6mm', marginTop:'3mm' } },
          e('div', { style:{ display:'flex', gap:'6mm', flexWrap:'wrap', fontFamily:mono, fontSize:'2.8mm', letterSpacing:'.06em', color:'#8A7D63' } },
            legendKinds.map(k => {
              const sample = printable.find(ev => ev.kind === k) || { kind: k };
              const st = styleOf(sample);
              return e('span', { key:k, style:{ display:'inline-flex', alignItems:'center', gap:'1.6mm' } },
                e('span', { style:{ display:'inline-block', width:'3.2mm', height:'3.2mm', background:st.bg, borderLeft:'1mm solid ' + st.accent } }),
                (st.glyph ? st.glyph + ' ' : '') + kindLabel(k));
            }),
            iconEvents.map(ev => {
              const s = ev.start != null ? ev.start : ev.day, en = ev.end != null ? ev.end : ev.day;
              return e('span', { key:ev.id, style:{ display:'inline-flex', alignItems:'center', gap:'1.4mm', color:'#5A513B' } },
                e(EventIcon, { name:eventIconKey(ev), size:'3.6mm', color:styleOf(ev).accent }),
                ev.label + ' ' + (s === en ? s : s + '–' + en));
            })
          ),
          e('div', { style:{ flex:'none', display:'inline-flex', alignItems:'center', gap:'1.8mm', fontFamily:mono, fontSize:'3mm', letterSpacing:'.06em', color:'#8A7D63', whiteSpace:'nowrap' } },
            igGlyph('3.8mm', '#8A7D63'), '@' + IG_HANDLE)
        )
      ));
    });

    // Photo index: the twelve month photos over three pages, four per page,
    // two across. Tiles keep the photos' 3:2 shape, at 130mm wide — the most
    // that two rows plus a small month label fit in the sheet's height — and
    // the block sits centred on the sheet.
    [0, 4, 8].forEach((start, pi) => {
      pages.push(label('l-index-' + pi, 'Photo index · ' + (pi + 1) + ' of 3'));
      pages.push(e('div', { key:'index-' + pi, className:'print-sheet', style:{ padding:'4mm', background:'#FCFAF1', justifyContent:'center', alignItems:'center' } },
        e('div', { style:{ display:'grid', gridTemplateColumns:'repeat(2, minmax(0, 1fr))', gap:'3mm', width:'263mm', maxWidth:'100%' } },
          data.slice(start, start + 4).map(m2 =>
            e('div', { key:m2.key, style:{ minWidth:0 } },
              e('div', { style:{ position:'relative', aspectRatio:'3 / 2', overflow:'hidden', background:'#F1EBDB' } },
                e(PrintMonthPhoto, { monthKey:m2.key, monthName:m2.name, locs:m2.locations, preferId:m2.printLoc, epoch:imgEpoch, photoIndex, variant:'tile' })
              ),
              e('div', { style:{ marginTop:'1.2mm', fontFamily:mono, fontSize:'2.6mm', lineHeight:1.1, letterSpacing:'.14em', textTransform:'uppercase', color:'#9C8F71' } }, m2.name)
            )
          )
        )
      ));
    });

    // Back cover: a photo of its own, with the same band as the front.
    pages.push(label('l-back', 'Back cover'));
    pages.push(e('div', { key:'back', className:'print-sheet', style:{ background:'#FCFAF1' } },
      slot('photos/print-back', 'the back-cover photo'),
      coverBand()
    ));

    const pageCount = 1 + data.length * 2 + 3 + 1;
    return e('div', null,
      // the controls share the sheets' width and centring, so their left edge lines up with the pages
      e('div', { className:'no-print', style:{ display:'flex', flexDirection:'column', gap:12, width:'281mm', maxWidth:'100%', margin:'0 auto 10px' } },
        e('div', { style:{ display:'flex', alignItems:'center', gap:'10px 14px', flexWrap:'wrap' } },
          e('button', { className:'btn-hover', onClick:goToYear, style:GreenBtn }, e('span', { style:{ fontSize:15, lineHeight:1, marginTop:-1 } }, '←'), ' Home'),
          yearRow(),
          e('button', { className:'btn-hover', onClick:()=>window.print(), style:{ ...GreenBtn, gap:8 } }, e('span', { style:{ fontSize:14, lineHeight:1, marginTop:-1 } }, '⎙'), ' Print / save PDF'),
          e('span', { style:{ fontFamily:mono, fontSize:11, color:'#8A7D63', letterSpacing:'.03em' } }, pageCount + ' pages · A4 landscape · ' + viewYear)
        ),
        editMode && e('div', { style:{ display:'flex', alignItems:'center', gap:'8px 8px', flexWrap:'wrap' } },
          e('span', { style:{ fontFamily:mono, fontSize:10, letterSpacing:'.16em', textTransform:'uppercase', color:'#9C8F71', marginRight:6 } }, 'Print these event types'),
          kindOrder.map(k => chip('k-' + k, !hiddenKinds.has(k), (kindGlyph(k) ? kindGlyph(k) + ' ' : '') + kindLabel(k), () => toggleKind(k))),
          e('span', { key:'div', style:{ width:1, height:22, background:'#D2C7AC', margin:'0 6px' } }),
          chip('captions', captions, 'Photo captions', () => setPrintPref({ captions: !captions }))
        ),
        e('div', { style:{ fontFamily:mono, fontSize:11, color:'#8A7D63', letterSpacing:'.03em', lineHeight:1.6, maxWidth:'110ch' } },
          'In the print dialog choose A4, Landscape, default margins and 100% scale (switch "Background graphics" on if colours print pale); "Save as PDF" keeps a copy. ' +
          'Each month uses its ★-starred location’s photo, or its first location with a photo; its caption sits top-right of the month’s calendar page (the "Photo captions" switch above). ' +
          'UK bank holidays (England & Wales, substitutes included) and the named days — saints’ days, Mothering Sunday, Father’s Day, Remembrance, Halloween, Bonfire Night, Christmas Eve, New Year’s Eve and so on — are worked out for the chosen year and sit as small text beside the date; the "Bank holidays" and "Named days" switches turn them off. ' +
          'Drop a photo onto the cover and back-cover sheets below. Untick "Shown on the printable calendar" in an event’s editor to keep a single event off. ' +
          'Photos now upload with a print-size copy (' + PRINT_MAX_EDGE + 'px); a sheet flagged "web size only" holds an older photo — drop it on again to replace it at print quality.' +
          (isMobile ? ' Best previewed and printed from a desktop browser.' : '')
        )
      ),
      pages
    );
  };

  // ─── Event editor modal ────────────────────────────────────────────────────
  const renderEventModal = () => {
    if (!draft || !draftView) return null;
    // Built-in types plus every custom type found anywhere in the calendar
    // (and the draft's own, in case it was just created and isn't saved yet).
    const customKindMap = new Map();
    data.forEach(m2 => allMonthEvents(m2).forEach(ev => {
      if (isCustomKind(ev.kind) && !customKindMap.has(ev.kind)) customKindMap.set(ev.kind, { kind: ev.kind, label: ev.kindLabel || 'Custom', color: ev.kindColor });
    }));
    if (isCustomKind(draft.kind) && !customKindMap.has(draft.kind)) customKindMap.set(draft.kind, { kind: draft.kind, label: draft.kindLabel || 'Custom', color: draft.kindColor });
    const kindOpts = KIND_ORDER.filter(k => k !== 'trip').map(k => { // trips come from the Trips page
      const st = EVENT_STYLE[k];
      return { k, label:KIND_LABEL[k], ...st, sel: draft.kind===k };
    }).concat(Array.from(customKindMap.values()).map(ck => {
      const p = paletteFor(ck.color);
      return { k: ck.kind, label: ck.label, glyph: CUSTOM_KIND_GLYPH, bg: p.bg, fg: p.fg, accent: p.accent, sel: draft.kind === ck.kind, custom: ck };
    }));
    const locOpts = month.locations.map(l => ({ ...l, sel: draft.locId===l.id }));

    return e('div', { onClick:()=>setEditingEvent(null), style:{ position:'fixed', inset:0, background:'rgba(42,37,30,0.34)', display:'flex', alignItems:'center', justifyContent:'center', padding:22, zIndex:60 } },
      e('div', { onClick:(ev)=>ev.stopPropagation(), style:{ width:392, maxWidth:'100%', background:'#FBF7EC', border:'1px solid #2A251E', boxShadow:'9px 9px 0 rgba(42,37,30,0.20)' } },
        e('div', { style:{ height:5, background:draftView.accent } }),
        e('div', { style:{ padding:'17px 20px 20px' } },
          e('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:12 } },
            e('span', { style:{ fontFamily:"'IBM Plex Mono',monospace", fontSize:11, letterSpacing:'.18em', textTransform:'uppercase', color:'#8A7D63' } }, draftView.heading),
            e('button', { className:'close-btn', onClick:()=>setEditingEvent(null), title:'Close', 'aria-label':'Close the event editor', style:{ width:28, height:28, background:'none', border:'1px solid #D2C7AC', color:'#8A7D63', fontSize:16, lineHeight:1, cursor:'pointer', fontFamily:"'Spectral',serif" } }, '×')
          ),
          // Preview chip
          e('div', { style:{ marginTop:15, display:'flex', alignItems:'center', gap:8, padding:'9px 11px', background:draftView.bg, color:draftView.fg, borderLeft:'3px solid '+draftView.accent, borderRadius:2, fontFamily:"'IBM Plex Mono',monospace", fontSize:11, fontWeight:500 } },
            eventIconKey(draft) ? e(EventIcon, { name:eventIconKey(draft), size:15, color:draftView.accent }) : (draftView.glyph && e('span', null, draftView.glyph)),
            e('span', { style:{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } }, draftView.previewLabel)
          ),
          // Title or location picker
          draftView.isNormal
            ? e('div', { style:{ marginTop:16 } },
                e('div', { style:{ fontFamily:"'IBM Plex Mono',monospace", fontSize:10, letterSpacing:'.14em', textTransform:'uppercase', color:'#9C8F71', marginBottom:6 } }, 'Title'),
                e('input', { value:draft.label || '', onChange:(ev)=>setEditingEvent(p=>({...p,label:ev.target.value})), placeholder:'Event name', style:{ width:'100%', background:'#FFFDF5', border:'1px solid #C9BD9F', color:'#2A251E', fontFamily:"'Spectral',serif", fontSize:15, padding:'9px 11px', outline:'none' } })
              )
            : e('div', { style:{ marginTop:16 } },
                e('div', { style:{ fontFamily:"'IBM Plex Mono',monospace", fontSize:10, letterSpacing:'.14em', textTransform:'uppercase', color:'#9C8F71', marginBottom:6 } }, 'Location card'),
                e('div', { style:{ display:'flex', flexWrap:'wrap', gap:7 } },
                  locOpts.map(lo =>
                    e('button', { key:lo.id, className:'loc-pick', onClick:()=>setEditingEvent(p=>({...p,locId:lo.id})), style:{ position:'relative', display:'flex', alignItems:'center', gap:7, padding:'7px 11px', background:'#FFFDF5', color:'#2A251E', border:'1px solid '+(lo.sel?'#54632F':'#C9BD9F'), borderRadius:2, cursor:'pointer', fontFamily:"'Spectral',serif", fontSize:13 } },
                      e('span', { style:{ width:8, height:8, borderRadius:'50%', background: lo.region==='UK' ? '#54632F' : '#9E4B26', display:'inline-block', flex:'none' } }),
                      lo.name,
                      lo.sel && e('span', { style:{ position:'absolute', top:-6, right:-6, width:17, height:17, borderRadius:'50%', background:'#2A251E', border:'1px solid #2A251E', color:'#FBF7EC', fontSize:10, lineHeight:'15px', textAlign:'center' } }, '✓')
                    )
                  )
                )
              ),
          // Start / End day
          e('div', { style:{ marginTop:14, display:'flex', gap:12 } },
            e('div', { style:{ flex:1 } },
              e('div', { style:{ fontFamily:"'IBM Plex Mono',monospace", fontSize:10, letterSpacing:'.14em', textTransform:'uppercase', color:'#9C8F71', marginBottom:6 } }, 'Start day'),
              e('input', { type:'number', min:1, max:month.days, value:draft.start, onChange:(ev)=>setEditingEvent(p=>({...p,start:ev.target.value})), style:{ width:'100%', background:'#FFFDF5', border:'1px solid #C9BD9F', color:'#2A251E', fontFamily:"'IBM Plex Mono',monospace", fontSize:15, padding:'9px 11px', outline:'none' } })
            ),
            e('div', { style:{ flex:1 } },
              e('div', { style:{ fontFamily:"'IBM Plex Mono',monospace", fontSize:10, letterSpacing:'.14em', textTransform:'uppercase', color:'#9C8F71', marginBottom:6 } }, 'End day'),
              e('input', { type:'number', min:1, max:month.days, value:draft.end, onChange:(ev)=>setEditingEvent(p=>({...p,end:ev.target.value})), style:{ width:'100%', background:'#FFFDF5', border:'1px solid #C9BD9F', color:'#2A251E', fontFamily:"'IBM Plex Mono',monospace", fontSize:15, padding:'9px 11px', outline:'none' } })
            )
          ),
          e('div', { style:{ marginTop:6, fontFamily:"'IBM Plex Mono',monospace", fontSize:10, color:'#A89A7C', letterSpacing:'.04em' } }, month.name + ' · days 1–' + month.days),
          // Type
          e('div', { style:{ marginTop:16 } },
            e('div', { style:{ fontFamily:"'IBM Plex Mono',monospace", fontSize:10, letterSpacing:'.14em', textTransform:'uppercase', color:'#9C8F71', marginBottom:8 } }, 'Type'),
            e('div', { style:{ display:'flex', flexWrap:'wrap', gap:8 } },
              kindOpts.map(k =>
                e('button', { key:k.k, className:'kind-btn', onClick:()=> k.custom ? setEditingEvent(p => p && ({ ...p, kind:k.k, kindLabel:k.custom.label, kindColor:k.custom.color })) : setDraftKind(k.k), style:{ position:'relative', display:'flex', alignItems:'center', gap:7, padding:'6px 11px 6px 9px', background:k.bg, color:k.fg, border:'1px solid '+k.accent, borderRadius:2, cursor:'pointer', fontFamily:"'IBM Plex Mono',monospace", fontSize:11, letterSpacing:'.03em' } },
                  e('span', { style:{ width:10, height:10, borderRadius:'50%', background:k.accent, display:'inline-block', flex:'none' } }),
                  k.label,
                  k.sel && e('span', { style:{ position:'absolute', top:-6, right:-6, width:17, height:17, borderRadius:'50%', background:'#FBF7EC', border:'1px solid #2A251E', color:'#2A251E', fontSize:10, lineHeight:'15px', textAlign:'center' } }, '✓')
                )
              ),
              e('button', { className:'kind-btn', onClick:addCustomKind, title:'Create a new event type', style:{ display:'flex', alignItems:'center', gap:6, padding:'6px 11px', background:'#FFFDF5', color:'#5A513B', border:'1px dashed #A89A7C', borderRadius:2, cursor:'pointer', fontFamily:"'IBM Plex Mono',monospace", fontSize:11, letterSpacing:'.03em' } }, '+ New type')
            )
          ),
          // Shown as — a picture in the corner of each day (nature/season windows
          // and custom types), or the usual bar. "Auto" picks from the title.
          (draft.kind === 'nature' || draft.kind === 'season' || isCustomKind(draft.kind)) && (() => {
            const autoKey = defaultIconKey(draft.label);
            const cur = draft.icon || 'auto';
            const opts = [{ k:'auto', label:'Auto' + (autoKey ? ' — ' + EVENT_ICONS[autoKey].label + ', from the title' : ' — a bar (no icon matches the title)') }, { k:'none', label:'A bar across the days' }]
              .concat(ICON_ORDER.map(k => ({ k, label: EVENT_ICONS[k].label })));
            const btn = (o, child) => { const sel = cur === o.k; return e('button', { key:o.k, className:'kind-btn', title:o.label, 'aria-label':o.label, onClick:()=>setEditingEvent(p=>p&&({ ...p, icon:o.k })), style:{ display:'inline-flex', alignItems:'center', justifyContent:'center', gap:5, minWidth:32, height:30, padding:'0 8px', background: sel ? '#54632F' : '#FFFDF5', color: sel ? '#FBF7EC' : '#5A513B', border:'1px solid ' + (sel ? '#2A251E' : '#C9BD9F'), borderRadius:2, cursor:'pointer', fontFamily:"'IBM Plex Mono',monospace", fontSize:10.5, letterSpacing:'.04em' } }, child); };
            return e('div', { style:{ marginTop:16 } },
              e('div', { style:{ fontFamily:"'IBM Plex Mono',monospace", fontSize:10, letterSpacing:'.14em', textTransform:'uppercase', color:'#9C8F71', marginBottom:8 } }, 'Shown as'),
              e('div', { style:{ display:'flex', flexWrap:'wrap', gap:6 } },
                opts.map(o => btn(o, o.k === 'auto' ? [autoKey && e(EventIcon, { key:'i', name:autoKey, size:15 }), 'Auto'] : o.k === 'none' ? '▬ Bar' : e(EventIcon, { name:o.k, size:16 })))
              ),
              e('div', { style:{ marginTop:6, fontFamily:"'IBM Plex Mono',monospace", fontSize:10, color:'#A89A7C', letterSpacing:'.04em' } }, cur === 'none' ? 'Drawn as a bar across its days.' : 'An icon in the corner of each day, the title beside it on the first day, and a key under the grid.')
            );
          })(),
          // Printable calendar — on by default, untick to keep this event off it
          e('label', { style:{ marginTop:16, display:'flex', alignItems:'center', gap:9, cursor:'pointer', userSelect:'none' } },
            e('input', { type:'checkbox', checked:!draft.noPrint, onChange:(ev)=>{ const on = ev.target.checked; setEditingEvent(p=>p&&({ ...p, noPrint:!on })); }, style:{ width:15, height:15, margin:0, accentColor:'#54632F', cursor:'pointer' } }),
            e('span', { style:{ fontFamily:"'IBM Plex Mono',monospace", fontSize:11, letterSpacing:'.04em', color: draft.noPrint ? '#A89A7C' : '#5A513B' } }, draft.noPrint ? 'Hidden from the printable calendar' : 'Shown on the printable calendar')
          ),
          // Yearly repeater — birthdays, anniversaries: the same dates every year
          e('label', { style:{ marginTop:10, display:'flex', alignItems:'center', gap:9, cursor:'pointer', userSelect:'none' } },
            e('input', { type:'checkbox', checked:!!draft.annual, onChange:(ev)=>{ const on = ev.target.checked; setEditingEvent(p=>p&&({ ...p, annual:on })); }, style:{ width:15, height:15, margin:0, accentColor:'#54632F', cursor:'pointer' } }),
            e('span', { style:{ fontFamily:"'IBM Plex Mono',monospace", fontSize:11, letterSpacing:'.04em', color: draft.annual ? '#5A513B' : '#A89A7C' } }, draft.annual ? 'Repeats every year (birthdays, anniversaries)' : 'Repeats every year')
          ),
          // Save / Delete
          e('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:12, marginTop:22, paddingTop:15, borderTop:'1px solid #E6DECA' } },
            e('button', { className:'del-btn', onClick:deleteEvent, style:{ display:'inline-flex', alignItems:'center', gap:7, background:'none', border:'1px solid #D9B3A6', color:'#9C3B22', fontFamily:"'IBM Plex Mono',monospace", fontSize:11, letterSpacing:'.1em', textTransform:'uppercase', padding:'8px 13px', cursor:'pointer' } },
              e('span', { style:{ fontSize:13, lineHeight:1 } }, '✕'), ' Delete'
            ),
            e('button', { className:'save-btn', onClick:saveEvent, style:{ display:'inline-flex', alignItems:'center', gap:7, background:'#54632F', border:'1px solid #2A251E', color:'#FBF7EC', fontFamily:"'IBM Plex Mono',monospace", fontSize:11, letterSpacing:'.1em', textTransform:'uppercase', padding:'9px 17px', cursor:'pointer', boxShadow:'3px 3px 0 rgba(42,37,30,0.14)' } }, 'Save event')
          )
        )
      )
    );
  };

  // ─── Cloud status banner ───────────────────────────────────────────────────
  // Shown only when something needs the owner's attention: the cloud copy can't
  // be read (editing paused), or a change hasn't been saved yet.
  const renderCloudBanner = () => {
    if (cloudStatus !== 'offline' && cloudStatus !== 'unsaved') return null;
    const offline = cloudStatus === 'offline';
    const noKey = !offline && !Storage.peekUploadKey();
    const msg = offline
      ? 'Can\'t reach the shared calendar — showing the copy last saved on this device. Editing is paused until it reconnects.'
      : noKey
        ? 'Your latest change has not been saved — the edit password was rejected.'
        : 'Your latest change has not reached the shared calendar yet — retrying automatically.';
    const onRetry = () => {
      if (offline) { loadFromCloud(); return; }
      if (!Storage.peekUploadKey() && !ensureUnlocked(pushToCloud)) return;
      pushToCloud();
    };
    return e('div', { className:'no-print', role:'status', style:{ display:'flex', alignItems:'center', gap:'8px 14px', flexWrap:'wrap', marginBottom:isMobile?14:20, padding:'9px 12px', background:'#F3E3D6', border:'1px solid #D9B3A6', fontFamily:"'IBM Plex Mono',monospace", fontSize:11, letterSpacing:'.04em', lineHeight:1.5, color:'#7A3A22' } },
      e('span', { style:{ flex:'1 1 240px' } }, '⚠ ' + msg),
      e('button', { className:'btn-hover', onClick:onRetry, style:{ height:30, padding:'0 12px', background:'#FBF7EC', border:'1px solid #9C3B22', color:'#9C3B22', fontFamily:"'IBM Plex Mono',monospace", fontSize:10.5, letterSpacing:'.1em', textTransform:'uppercase', cursor:'pointer', boxShadow:'2px 2px 0 rgba(42,37,30,0.10)' } },
        offline ? 'Retry now' : (noKey ? 'Enter password & retry' : 'Retry now'))
    );
  };

  // ─── Prompt dialog (password / short names) ────────────────────────────────
  const renderDialog = () => {
    if (!dialog) return null;
    const mono = "'IBM Plex Mono',monospace";
    const isPw = dialog.kind === 'password';
    const isConfirm = dialog.kind === 'confirm';
    const eye = (slashed) => e('svg', { width:18, height:18, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:1.8, strokeLinecap:'round', strokeLinejoin:'round', 'aria-hidden':'true' },
